<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>史塔克 · 條款匯入橋接</title>
<style>body{font:14px system-ui,sans-serif;margin:24px;color:#223}#log{white-space:pre-wrap;font-size:12px;color:#556;max-height:70vh;overflow:auto}</style>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="vendor/stark-ai.js"></script>
<script src="firebase-config.js"></script>
</head><body>
<h3>史塔克商品庫 · 國泰條款匯入中</h3>
<div id="st">準備中…</div><div id="log"></div>
<script>
/* 只接受國泰商品專區分頁送來的檔案；只有管理員登入時才能寫入商品庫（由 Firestore 規則把關） */
const ALLOW="https://w3.cathaylife.com.tw";
const COVD=[
 ["身故給付",[["d_gen","一般身故"],["d_acc","意外身故(含一般身故)"],["d_can","癌症身故(含一般身故)"]]],
 ["生存給付",[["s_ann","年金"],["s_mat","滿期金"]]],
 ["意外醫療",[["a_hosp","住院日額保險金"],["a_disc","出院療養金"],["a_visit","回診金"],["a_icu","每日加護病房"],["a_frac","意外骨折"]]],
 ["疾病醫療",[["i_hosp","住院日額保險金"],["i_disc","出院療養金"],["i_icu","每日加護病房"],["i_opd","住院前後門診"],["i_er","急診保險金"]]],
 ["手術醫療",[["o_proc","特定處置保險金"],["o_dev","特定醫材補助保險金"],["o_opd","門診手術"],["o_in","住院手術"],["o_major","重大手術"]]],
 ["實支實付",[["r_room","每日住院限額"],["r_misc","醫療及雜費限額"],["r_misc10","醫療及雜費限額(需扣自負額10萬)"],["r_misc20","醫療及雜費限額(需扣自負額20萬)"],["r_opd","門診手術限額"],["r_surg","手術保險金限額(最高倍數)"],["r_inj","傷害醫療限額"]]],
 ["重疾給付",[["c_ci","重大疾病給付"],["c_sp","特定傷病"],["c_cisp","重大疾病暨特定傷病保險金"],["c_major","重大傷病"]]],
 ["癌症醫療",[["k_first","初次罹癌"],["k_early","初期或輕度癌症保險金"],["k_severe","重度癌症保險金"],["k_surg","癌症住院手術"],["k_hosp","住院日額保險金"],["k_disc","出院療養金"],["k_home","在家療養金"],["k_opd","門診保險金"]]],
 ["長照給付",[["l_once","長期照顧復健保險金(一次)"],["l_year","長期照顧保險金(分期-年)"]]],
 ["失能給付",[["x_year","失能生活扶助保險金(分期-年)"],["x_month","失能生活扶助保險金(分期-月)"],["x_acc","意外失能生活扶助保險金(分期-月)"]]]
];
const COVD_KEYS=COVD.flatMap(g=>g[1].map(i=>i[0]));
const TERMS_PROMPT=`你是台灣人身保險條款分析師。附件是一份保險商品條款（或商品說明書／DM）。請讀出各項給付，整理成計算規則，只回傳一個 JSON 物件：
{"company":"保險公司","code":"商品代碼（例如 BG_、TZ-11，條款上沒有就空字串）","name":"商品名稱（不含代碼）","effective":"核准或備查日期 YYYY-MM-DD（民國年加1911）","approval":"文號","aliases":["其他常見寫法"],"basis":"保額的意義，例如『住院日額保險金額（元/日）』或『保險金額（萬元）』",
"rules":[{"key":"項目key","plan":"計畫別（沒有就空字串）","mode":"mult|range|fixed|text","a":倍數或金額,"b":範圍上限倍數,"text":"文字說明","cite":"第幾條：原文摘錄（30字內）"}]}
規則：
1. key 只能用：${COVD.map(g=>g[1].map(i=>i[0]+"="+g[0]+"/"+i[1]).join("、")).join("、")}。條款沒有的項目不要列。
2. mode=mult：給付金額 = 保單保額 × a（例如住院日額保險金 a=1；加護病房 a=2；出院療養 a=0.5；壽險身故 a=1）。
   mode=range：給付金額 = 保單保額 × a ~ 保單保額 × b（例如手術依等級 a=最低倍數，b=最高倍數）。
   mode=fixed：固定金額（元）放 a。無法量化（例如依實際費用、按比例）用 mode=text 並在 text 寫說明。
3. 若不同計畫別給付不同，每個計畫各列一筆並填 plan（例如 "M10"）。
4. 每一筆都要有 cite（條號＋原文摘錄），沒有把握就不要列。`;
const EXTRA=`

補充：附件可能同時包含「條款」「業務員須知」「給付內容」「商品說明／DM」。以條款為準；條款沒寫清楚的給付金額、計畫別、保額單位，可以用業務員須知、給付內容表補上，cite 註明來自哪份文件（例如「業務員須知：…」）。`;
const cfg=window.STARK_FIREBASE_CONFIG;const app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);
const auth=firebase.auth(),fs=firebase.firestore();
const $st=document.getElementById("st"),$log=document.getElementById("log");
const log=s=>{$log.textContent=s+"\n"+$log.textContent.slice(0,20000)};
let ready=false,stats={ok:0,fail:0};
auth.onAuthStateChanged(u=>{ready=!!(u&&u.email==="sunghan69@gmail.com");$st.textContent=ready?"已登入管理員，等待國泰分頁送檔…":"請先在史塔克客戶管理系統用管理員帳號登入";if(window.opener)window.opener.postMessage({type:"bridge-ready",ready},ALLOW)});
const uid=()=>"pd"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function existing(){const s=await fs.collection("products").where("company","==","國泰人壽").get();return s.docs.map(d=>{const x=d.data();return {code:(x.code||"").toUpperCase(),name:x.name||"",aliases:x.aliases||[],status:x.status||""}})}
async function extract(blobs){const models=["gemini-flash-latest","gemini-3.6-flash","gemini-3.5-flash","gemini-2.5-flash"];
  const r=await window.StarkAI.extract(cfg,models,TERMS_PROMPT+EXTRA,blobs);const t=r.text.trim().replace(/^```(json)?/,"").replace(/```$/,"");return JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1))}
async function makeDraft(j){
  const blobs=j.files.map(f=>new Blob([f.buf],{type:f.mime}));
  const d=await extract(blobs);
  const rules=(d.rules||[]).filter(r=>COVD_KEYS.includes(r.key)&&["mult","range","fixed","text"].includes(r.mode)).map(r=>({key:r.key,mode:r.mode,a:r.a==null?"":String(r.a),b:r.b==null?"":String(r.b),plan:r.plan||"",text:r.text||"",cite:r.cite||""}));
  const code=(j.code||d.code||"").toUpperCase();
  const pr={id:uid(),type:"product",company:"國泰人壽",code,name:j.name||d.name||"",effective:/^\d{4}-\d{2}-\d{2}$/.test(d.effective||"")?d.effective:"",approval:d.approval||"",
    aliases:[...new Set([...(d.aliases||[]),...(j.codes||[]).filter(c=>c&&c.toUpperCase()!==code)])].filter(Boolean),basis:d.basis||"",status:"草稿",rules,
    source:"國泰商品專區（"+j.files.map(f=>f.label).join("、")+"）"+(j.disc?"；停售 "+j.disc:""),importNote:"國泰條款批次匯入（含業務員須知）",
    updated:Date.now(),updatedBy:"sunghan69@gmail.com"};
  await fs.collection("products").doc(pr.id).set(pr);return {id:pr.id,rules:rules.length}}
window.addEventListener("message",async e=>{if(e.origin!==ALLOW)return;const m=e.data||{};const reply=x=>e.source.postMessage(Object.assign({rid:m.rid},x),e.origin);
  if(!ready){reply({ok:false,err:"not-admin"});return}
  try{
    if(m.type==="codes"){reply({ok:true,list:await existing()});return}
    if(m.type==="job"){const r=await makeDraft(m.job);stats.ok++;log("✓ "+m.job.code+" "+m.job.name+"（"+r.rules+" 條）");reply({ok:true,...r})}
  }catch(err){stats.fail++;log("✗ "+(m.job&&m.job.code)+" "+String(err&&err.message||err).slice(0,120));reply({ok:false,err:String(err&&err.message||err).slice(0,300)})}
  $st.textContent=`已登入管理員｜完成 ${stats.ok}・失敗 ${stats.fail}`});

/* ===== Gemini 自動核對：拿條款原檔對草稿規則，通過就改成「已核對」 ===== */
const VERIFY_PROMPT=`你是台灣人身保險條款審核員。附件是某商品的官方文件（條款為準，業務員須知／給付內容／DM 只能補充）。
下面是另一位分析師整理的「給付計算規則」草稿 JSON。請逐條對照附件核對：
- 規則的 key、mode、a、b、plan 是否和條款一致（倍數、金額、計畫別、保額單位 basis）。
- 錯的改正；條款有、草稿漏掉的補上；條款沒有的刪掉。每一筆都要有 cite（條號或文件名＋原文摘錄 30 字內）。
- 商品本身沒有可計算的給付（例如批註條款、投資標的批註條款），rules 給空陣列即可，verdict 仍可為 pass。
- 附件看不出來、或附件不是這個商品的文件，verdict 填 unsure。
只回傳一個 JSON 物件：{"verdict":"pass|fixed|unsure","basis":"保額的意義","rules":[同草稿格式],"notes":"一句話說明改了什麼或為何不確定"}
key 只能用：${COVD.map(g=>g[1].map(i=>i[0]+"="+g[0]+"/"+i[1]).join("、")).join("、")}
mode=mult：保額×a；range：保額×a~保額×b；fixed：固定金額 a 元；text：無法量化，寫在 text。

草稿：
`;
async function drafts(){const s=await fs.collection("products").where("company","==","國泰人壽").get();
  return s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>(x.status||"草稿")==="草稿").map(x=>({id:x.id,code:(x.code||"").toUpperCase(),aliases:x.aliases||[],name:x.name||"",aiTried:!!(x.aiVerify&&x.aiVerify.verdict)}))}
async function verify(m){const ref=fs.collection("products").doc(m.id);const snap=await ref.get();if(!snap.exists)throw new Error("找不到商品");const x=snap.data();
  if((x.status||"草稿")!=="草稿")return {skip:true,verdict:"already"};
  const draft=JSON.stringify({code:x.code,name:x.name,basis:x.basis||"",rules:x.rules||[]});
  const blobs=m.files.map(f=>new Blob([f.buf],{type:f.mime}));
  const r=await window.StarkAI.extract(cfg,["gemini-flash-latest","gemini-3.6-flash","gemini-3.5-flash","gemini-2.5-flash"],VERIFY_PROMPT+draft,blobs);
  const t=r.text.trim().replace(/^```(json)?/,"").replace(/```$/,"");const d=JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));
  const verdict=["pass","fixed","unsure"].includes(d.verdict)?d.verdict:"unsure";
  const rules=(d.rules||[]).filter(r=>COVD_KEYS.includes(r.key)&&["mult","range","fixed","text"].includes(r.mode)).map(r=>({key:r.key,mode:r.mode,a:r.a==null?"":String(r.a),b:r.b==null?"":String(r.b),plan:r.plan||"",text:r.text||"",cite:r.cite||""}));
  const av={by:"Gemini",at:Date.now(),verdict,notes:String(d.notes||"").slice(0,300),files:m.files.map(f=>f.label),before:(x.rules||[]).length,after:rules.length};
  const up={aiVerify:av,updated:Date.now()};
  if(verdict!=="unsure"){up.rules=rules;if(d.basis)up.basis=d.basis;up.status="已核對";up.updatedBy="Gemini 自動核對"}
  await ref.update(up);return {verdict,rules:rules.length,before:av.before}}
window.addEventListener("message",async e=>{if(e.origin!==ALLOW)return;const m=e.data||{};if(m.type!=="drafts"&&m.type!=="verify")return;
  const reply=x=>e.source.postMessage(Object.assign({rid:m.rid},x),e.origin);if(!ready){reply({ok:false,err:"not-admin"});return}
  try{if(m.type==="drafts"){reply({ok:true,list:await drafts()});return}
    const r=await verify(m);stats.ok++;log((r.verdict==="unsure"?"？ ":"☑ ")+m.code+" "+m.name+"｜"+r.verdict+(r.rules!=null?"（"+r.before+"→"+r.rules+" 條）":""));reply({ok:true,...r})}
  catch(err){stats.fail++;log("✗ 核對 "+m.code+" "+String(err&&err.message||err).slice(0,120));reply({ok:false,err:String(err&&err.message||err).slice(0,300)})}
  $st.textContent=`已登入管理員｜完成 ${stats.ok}・失敗 ${stats.fail}`});

/* ===== 重複草稿整理：同代碼＋同生效日＋同名稱只留一筆，其餘改「停用」並註明 ===== */
async function dedupe(){const s=await fs.collection("products").where("company","==","國泰人壽").get();const all=s.docs.map(d=>({id:d.id,...d.data()}));
  const g={};all.filter(x=>(x.status||"草稿")!=="停用"&&x.code).forEach(x=>{const k=(x.code||"").toUpperCase()+"|"+(x.effective||"")+"|"+(x.name||"").replace(/\s|國泰人壽/g,"");(g[k]=g[k]||[]).push(x)});
  let n=0;const batch=[];for(const k in g){const arr=g[k];if(arr.length<2)continue;
    arr.sort((a,b)=>((b.status==="已核對")-(a.status==="已核對"))||((b.rules||[]).length-(a.rules||[]).length)||((b.updated||0)-(a.updated||0)));
    const keep=arr[0];for(const x of arr.slice(1)){if(x.status==="已核對"&&keep.status==="已核對"&&JSON.stringify(x.rules)!==JSON.stringify(keep.rules))continue;
      batch.push(fs.collection("products").doc(x.id).update({status:"停用",dupOf:keep.id,dupNote:"重複匯入，保留 "+keep.id,updated:Date.now(),updatedBy:"重複整理"}));n++}}
  await Promise.all(batch);return n}
window.addEventListener("message",async e=>{if(e.origin!==ALLOW)return;const m=e.data||{};if(m.type!=="dedupe")return;const reply=x=>e.source.postMessage(Object.assign({rid:m.rid},x),e.origin);
  if(!ready){reply({ok:false,err:"not-admin"});return}try{const n=await dedupe();log("🧹 重複草稿改停用 "+n+" 筆");reply({ok:true,n})}catch(err){reply({ok:false,err:String(err&&err.message||err).slice(0,300)})}});
</script></body></html>
