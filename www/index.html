<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>史塔克客戶管理系統</title>
<meta name="theme-color" content="#14365c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --ink:#1b2433; --muted:#6b7686; --line:#e3e7ee;
  --pri:#14365c; --pri2:#1f5a96; --acc:#e8833a; --ok:#2f9e6b; --warn:#d9a21b; --bad:#d0493f;
  --soft:#eef3f9; --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:220px;background:var(--pri);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand b{display:block;font-size:17px;font-weight:900;letter-spacing:.5px}
.brand small{opacity:.75;font-size:11.5px;letter-spacing:1px;color:#f3b27f}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.82);text-decoration:none;padding:10px 12px;border-radius:9px;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:#fff;color:var(--pri)}
.nav .ic{width:20px;text-align:center}
.side .foot{margin-top:auto;padding:14px 18px;font-size:12px;opacity:.7}
.main{flex:1;min-width:0;padding:26px 30px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:23px;margin:0;font-weight:900}
h2{font-size:17px;margin:0 0 12px;font-weight:700}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px}
.banner{background:#fff6e9;border:1px solid #f3d5a8;color:#7a4b10;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13.5px}
.banner.err{background:#fdeceb;border-color:#f2c0bb;color:#8a2a22}
/* cards */
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.kpi .v{font-size:27px;font-weight:900;color:var(--pri);line-height:1.2}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
/* buttons */
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c6cfdb}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.p:hover{background:var(--pri2)}
.btn.a{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.d{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tag{display:inline-block;background:var(--soft);color:var(--pri2);border-radius:6px;padding:1px 8px;font-size:12px;margin:2px 4px 2px 0}
.tag.o{background:#fdeee2;color:#b45e1c}
.tag.g{background:#e3f4ec;color:#21794f}
.tag.r{background:#fbe5e3;color:#a8342b}
.tag.y{background:#fbf2d9;color:#8c6a0c}
/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f8fafc}
.nm{font-weight:700}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.who{display:flex;align-items:center;gap:10px}
input.inp,select.inp,textarea.inp{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff;width:100%}
input.inp:focus,select.inp:focus,textarea.inp:focus{outline:2px solid #bcd3ee;border-color:var(--pri2)}
.search{max-width:280px}
/* list items */
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .when{width:62px;text-align:center;flex-shrink:0}
.li .when b{display:block;font-size:17px;color:var(--pri)}
.li .when span{font-size:11px;color:var(--muted)}
.li .body{flex:1;min-width:0}
.li .t{font-weight:700}
.li .d{font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
/* bars */
.bar{height:9px;background:#edf0f4;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri2);border-radius:9px}
.bar i.ok{background:var(--ok)} .bar i.mid{background:var(--warn)} .bar i.low{background:var(--bad)}
.covrow{display:grid;grid-template-columns:120px 1fr 150px;gap:12px;align-items:center;padding:8px 0}
.covrow .n{font-weight:500;font-size:14px}
.covrow .x{font-size:13px;text-align:right;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(15,25,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:880px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{max-width:440px}
.mh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh .x{margin-left:auto}
.mb{padding:20px 22px}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--pri);border-bottom-color:var(--acc)}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form .w2{grid-column:span 2}.form .w3{grid-column:1/-1}
.sec{grid-column:1/-1;font-weight:700;color:var(--pri);font-size:14px;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
.pol{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.insh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.insh b{background:#fff36b;padding:2px 10px;font-size:17px;border-radius:3px}
.psheet{margin-bottom:16px}
.phead{display:flex;align-items:stretch;border:1.5px solid #2fa84f;border-radius:8px;overflow:hidden;font-size:14px;flex-wrap:wrap;background:#fff}
.phead .no{background:#2fa84f;color:#fff;font-weight:700;padding:6px 12px;letter-spacing:1px;white-space:nowrap}
.phead .hd{padding:6px 12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.phead .hd i{font-style:normal;color:#1f8a3c}
.phead .pco{margin-left:auto;display:flex;align-items:center;gap:6px;padding:6px 10px;border-left:1px solid #cfe9d6;color:#333}.phead .pco+.pm{margin-left:0}
.phead .pm{margin-left:auto;padding:6px 12px;border-left:1px solid #cfe9d6;color:#333}
.pwrap{overflow-x:auto}
.ptbl{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px;min-width:680px;table-layout:fixed}
.ptbl th{font-weight:500;color:#666;font-size:12.5px;padding:6px;border-bottom:1px solid #ddd;text-align:center;white-space:nowrap}
.ptbl td{padding:8px 6px;text-align:center;border-bottom:1px solid #eee}
.ptbl tr.main td{background:#f1f3f1}
.ptbl tr.click{cursor:pointer}.ptbl tr.click:hover td{background:#e8f5ec}
.ptbl td.nm{text-align:left;font-weight:500}
.ptbl td.g{color:#1f8a3c;font-weight:700;word-break:break-word;overflow-wrap:anywhere;line-height:1.3}
.pmedit{cursor:pointer}.pmedit:hover{background:#eaf6ee}
.ptbl td.bf{font-size:12px;color:#1f8a3c;text-align:left;white-space:pre-line;min-width:110px}
.ptbl .rd{color:#2fa84f;margin-right:6px}
.ptbl tr.off td{opacity:.4}
.rov{position:fixed;inset:0;background:#5b6573;z-index:80;display:flex;flex-direction:column}
.rbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--pri);color:#fff}
.rscroll{flex:1;overflow:auto;padding:12px 8px}
.rpages{width:794px;margin:0 auto}
.a4{width:794px;height:1123px;background:#fff;margin:0 auto 14px;padding:30px 34px 20px;display:flex;flex-direction:column;box-shadow:0 4px 18px rgba(0,0,0,.25);color:#222;font-size:13px;overflow:hidden}
.rh{display:flex;align-items:center;gap:10px;border-bottom:2px solid #2fa84f;padding-bottom:6px;margin-bottom:10px}
.rh .ric{font-size:28px}.rh .rt{font-size:22px;font-weight:900}.rh .rsub{font-size:13px;color:#555}
.rh .rbox{margin-left:auto;border:1px solid #999;padding:2px 8px;font-size:11px;white-space:nowrap}
.rbody{flex:1;overflow:hidden}
.rco{display:flex;align-items:center;justify-content:center;gap:8px;color:#1f8a3c;font-weight:900;font-size:17px;border-bottom:2px solid #2fa84f;margin:10px 0 8px;padding-bottom:5px}
.insco{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#555}
.cob{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:#fff;font-weight:800;letter-spacing:-.5px;flex:none;line-height:1}
.con{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.con.sm{gap:4px;font-size:inherit}
.cohd{display:flex;align-items:center;gap:10px;margin:14px 0 6px;padding:6px 10px;background:var(--soft,#f2f6f9);border-radius:10px;font-size:15px}.cohd .sub{margin-left:auto}
.a4 .insh{margin:4px 0 8px}.a4 .insh b{font-size:15px}
.a4 .psheet{margin-bottom:10px}.a4 .ptbl{min-width:0;font-size:12.5px}.a4 .ptbl td{padding:5px 4px}.a4 .phead{font-size:13px}
.rf{border-top:1px solid #ddd;padding-top:6px;margin-top:6px}
.rdis{color:#d0493f;font-size:10px}
.rfb{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
.rno{border:1px solid #999;padding:1px 6px;font-size:10.5px}
.rbrand{display:flex;align-items:center;gap:8px;font-size:11px;color:#333}.rbrand b{font-size:13px}
.rlogo{background:var(--pri);color:#fff;font-weight:900;letter-spacing:2px;padding:4px 8px;border-radius:5px;border-bottom:3px solid var(--acc)}
.rcov{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:10.5px}
.rcov th,.rcov td{border:1px solid #9fd4ad;padding:1px 3px;height:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcov .rv{font-weight:600}.rcov .rplus{color:#888;margin:0 1px}.rcov .rtxt{color:#666}
.rfn{display:inline-block;background:#1f8a3c;color:#fff;border-radius:3px;font-size:8.5px;font-weight:700;padding:0 3px;line-height:1.4;margin-left:2px;vertical-align:1px}
.rnh{margin:14px 0 6px;font-size:14px;font-weight:800;color:#1f8a3c}.rnh span{font-size:11px;font-weight:400;color:#777}
.rnt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;line-height:1.5}
.rnt th{background:#2fa84f;color:#fff;font-weight:700;padding:4px 6px;border:1px solid #2fa84f;text-align:left}
.rnt td{border:1px solid #cfe9d6;padding:5px 6px;vertical-align:top}.rnt tr:nth-child(even) td{background:#f6fbf7}
.rnt .rn{color:#1f8a3c;font-weight:800;text-align:center}.rnt .rw{font-weight:700}.rnt .rit{color:#333}
.rnt .rl+.rl{margin-top:3px;padding-top:3px;border-top:1px dotted #cfe9d6}.rnt .rl b{display:inline-block;background:#eaf6ee;color:#1f8a3c;border-radius:4px;padding:0 5px;margin-right:6px;font-size:11px;font-weight:700}
.rcov .rins{background:#eaf6ee;color:#1f8a3c;font-size:15px;font-weight:900}
.rcov .rname{font-size:14px;font-weight:700;text-align:center}
.rcov .rg{background:#2fa84f;color:#fff;font-weight:700;font-size:12px;line-height:1.3;white-space:normal}
.rcov td.ri{font-size:10.5px}.rcov td{text-align:center}.rcov td.ri{text-align:left}
.rcov tbody.gap td{border:0;height:4px;padding:0}
.rmon{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11.5px}
.rmon th,.rmon td{border:1px solid #9fd4ad;padding:3px 3px;text-align:center}
.rmon thead th{font-size:14px;font-weight:700}
.rmon tbody th{background:#eaf6ee;font-weight:500;text-align:left}
.rmon tr.rprod td{color:#1f8a3c;font-weight:700;font-size:11px;height:40px}
.rmon tr.rmh td{text-align:left;font-weight:900;font-size:15px;background:#fff;border-left:0;border-right:0}
.rmon tr.rmr td,.rmon tr.rmr th{height:34px}
.rmon .cal{display:inline-block;border:1px solid #d0493f;border-top:5px solid #d0493f;border-radius:3px;padding:0 5px;font-size:11px;background:#fff}
.famgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.famcard{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.famcard.head{border-color:#2fa84f}.famcard.me{background:#f2faf4}
.famcard .fn{font-size:20px;font-weight:900;color:#1f8a3c;text-decoration:underline;cursor:pointer}
.famcard .fr{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
.famcard .fs{font-size:12px;color:var(--muted);margin-top:4px}
.famcard .fb{text-align:right;margin-top:6px}.famcard .fb .btn{color:var(--acc)}
.famadd{display:flex;flex-direction:column;gap:8px;justify-content:center}.famadd .btn{justify-content:center;padding:12px}
.scangrp{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;background:#fcfdfc}
.scangrp .sgh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ruletbl td{padding:3px 6px}.ruletbl td.sec{padding:8px 6px 2px}.ruletbl.onlyfilled tr.blank{display:none}
.scanbox{border:2px dashed #b8c4d4;border-radius:12px;padding:22px;text-align:center;background:#f8fafc}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.thumbs img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.pol .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pol .meta{font-size:13px;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1b2433;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.msgbox{background:#f6f8fb;border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:14px}
/* e-card */
.ecard{width:100%;max-width:380px;border-radius:18px;overflow:hidden;background:linear-gradient(140deg,var(--pri) 0%,#24507e 100%);color:#fff;padding:26px 24px;position:relative;box-shadow:0 14px 40px rgba(20,54,92,.3)}
.ecard:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(232,131,58,.25)}
.ecard .nmx{font-size:26px;font-weight:900}
.ecard .tt{opacity:.85;font-size:14px}
.ecard .sl{margin:16px 0;font-size:15px;border-left:3px solid var(--acc);padding-left:10px}
.ecard .ln{font-size:14px;opacity:.95;margin:3px 0}
.funnel{display:flex;gap:8px}
.funnel div{flex:1;background:var(--soft);border-radius:10px;padding:12px;text-align:center}
.funnel b{display:block;font-size:22px;color:var(--pri)}
.funnel span{font-size:12px;color:var(--muted)}
.claimtbl td:last-child,.claimtbl th:last-child{text-align:right}
.total{font-size:24px;font-weight:900;color:var(--acc)}
.hint{font-size:12.5px;color:var(--muted)}
body.gate .side{display:none}
.auth{min-height:80vh;display:flex;align-items:center;justify-content:center}
.auth .card{width:100%;max-width:420px;padding:28px}
.auth h1{font-size:22px}
.logo{display:inline-block;background:var(--pri);color:#fff;font-weight:900;letter-spacing:3px;padding:6px 12px;border-radius:8px;margin-bottom:12px;border-bottom:3px solid var(--acc)}
.eye{border:0;background:none;cursor:pointer;padding:0 4px;font-size:14px;line-height:1;vertical-align:middle}
.secure{-webkit-text-security:disc;text-security:disc}
.btn.line{background:#06c755;border-color:#06c755;color:#fff}
@media (max-width:900px){
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;flex-direction:row;z-index:40}
  .brand,.side .foot{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%;padding:6px}
  .nav a{flex-direction:column;gap:0;font-size:11px;padding:6px 4px}

  .form{grid-template-columns:1fr 1fr}

}
.kpi .vu{font-size:15px;font-weight:600;margin-left:4px;color:var(--muted,#6b7280)}.knames{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.kname{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--soft,#f2f6f9);font-size:13px;font-weight:600;cursor:pointer;color:inherit;text-decoration:none}.kname small{font-weight:400;color:var(--muted,#6b7280);font-size:11.5px}
details.fold{align-self:start}details.fold>summary{list-style:none;cursor:pointer;user-select:none}details.fold>summary::-webkit-details-marker{display:none}.fold .fchev{margin-left:8px;font-size:18px;color:var(--muted,#6b7280);transition:transform .2s}details.fold:not([open]) .fchev{transform:rotate(-90deg)}details.fold[open]>summary{margin-bottom:8px}.fold .fcount{font-size:13px;font-weight:600;color:var(--acc);margin-left:6px}

  follow:"{name}您好，我是{agent}，最近好嗎？上次聊到的保障規劃，想跟您約個時間再幫您整理一下，這週方便嗎？",
  care:"{name}您好，我是{agent}。天氣變化大，提醒您注意身體😊 若有就醫記得保留收據與診斷書，理賠我都可以協助您處理！"

/* ========== 工具 ========== */
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function num(v){const n=parseFloat(v);return isFinite(n)?n:0}
function fmt(n){return Math.round(n).toLocaleString("zh-TW")}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function pd(s){if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return null;return new Date(+m[1],+m[2]-1,+m[3])}
function ds(d){if(!d)return "";return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function md(d){return (d.getMonth()+1)+"/"+d.getDate()}
function addMonths(d,m){const r=new Date(d.getFullYear(),d.getMonth()+m,1);const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(d.getDate(),last));return r}
function daysBetween(a,b){return Math.round((b-a)/86400000)}
function age(b){const d=pd(b);if(!d)return "";const t=today();let a=t.getFullYear()-d.getFullYear();if(t<new Date(t.getFullYear(),d.getMonth(),d.getDate()))a--;return a}
function nextBday(b){const d=pd(b);if(!d)return null;const t=today();let n=new Date(t.getFullYear(),d.getMonth(),d.getDate());if(n<t)n=new Date(t.getFullYear()+1,d.getMonth(),d.getDate());return n}
function fq(p){return (p.freq===0||p.freq==="0")?0:(+p.freq||12)}
function usdRate(){return num((S.profile||{}).usdRate)||32}
function isUSD(p){const t=String(p.product||"")+" "+String(p.sumText||"");if(/美元|USD|美金/i.test(t))return true;if(p.currency!=="USD")return false;return !String(p.sumText||"").trim()||!/[萬元]/.test(String(p.sumText||""))}
function annualRaw(p){const f=fq(p);return f?num(p.premium)*(12/f):0}
function annual(p){return annualRaw(p)*(isUSD(p)?usdRate():1)}
function active(p){return !p.status||p.status==="有效"}
function paidUpDate(p){const s=pd(p.start);if(!s||num(p.payYears)<=1)return null;return addMonths(s,num(p.payYears)*12)}
function nextDue(p){
  const s=pd(p.start);if(!s||!active(p))return null;const f=fq(p);if(!f)return null;const t=today();const end=paidUpDate(p);
  let d=new Date(s);let i=0;while(d<t&&i<2000){d=addMonths(s,f*(++i))}
  if(end&&d>=end)return null;return d;
}
function cov(c){const r={};COV.forEach(x=>r[x.k]=0);(c.policies||[]).filter(active).forEach(p=>{const k=isUSD(p)?usdRate():1;COV.forEach(x=>{r[x.k]+=num((p.cov||{})[x.k])*k})});return r}
function target(k){const t=(S.profile.targets||{})[k];return t!=null&&t!==""?num(t):COV.find(x=>x.k===k).t}
function lifeTarget(c){const inc=num(c.income);return inc?Math.max(inc*10,target("life")):target("life")}
function annualSum(c){return (c.policies||[]).filter(active).reduce((a,p)=>a+annual(p),0)}
function tpl(k){return (S.profile.tpl||{})[k]||DEF_TPL[k]}
function fill(t,o){return t.replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m)}
function agentName(){return S.profile.agent||"您的保險顧問"}
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}

  try{const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(ok){toast("已複製，可直接貼到 LINE");return}}catch(e){}
  openText("請手動複製",t)}
function lineUrl(t){return "https://line.me/R/msg/text/?"+encodeURIComponent(t)}
function cById(id){return S.clients.find(c=>c.id===id)}
function idCheck(v){
  v=(v||"").toUpperCase().trim();if(!v)return "";
  if(/^[A-Z]{2}\d{8}$/.test(v))return true; // 舊式居留證
  if(!/^[A-Z][1289]\d{8}$/.test(v))return false;
  const L="ABCDEFGHJKLMNPQRSTUVXYWZIO",n=L.indexOf(v[0])+10;
  let sum=Math.floor(n/10)+(n%10)*9;for(let i=1;i<9;i++)sum+=+v[i]*(9-i);sum+=+v[9];return sum%10===0;
}
function maskId(v){return v&&v.length>=6?v.slice(0,3)+"****"+v.slice(-3):(v||"")}
const BANKS=["台灣銀行","土地銀行","合作金庫","第一銀行","華南銀行","彰化銀行","兆豐銀行","國泰世華","中國信託","台北富邦","玉山銀行","台新銀行","永豐銀行","元大銀行","凱基銀行","星展銀行","渣打銀行","聯邦銀行","遠東商銀","新光銀行","上海商銀","王道銀行","安泰銀行","將來銀行","LINE Bank","樂天銀行","中華郵政"];

function parsePay(s){s=(s||"").trim();const m=/^(.*?)[（(](轉帳件?|卡扣件?)[）)]/.exec(s);
  if(m)return {type:/卡扣/.test(m[2])?"信用卡轉帳":"銀行轉帳",bank:m[1].trim(),other:""};
  if(/信用卡|卡扣/.test(s))return {type:"信用卡轉帳",bank:s.replace(/信用卡|卡扣件?|[（()）]/g,"").trim(),other:""};
  if(/轉帳/.test(s))return {type:"銀行轉帳",bank:s.replace(/銀行轉帳|轉帳件?|[（()）]/g,"").trim(),other:""};
  return {type:"其他",bank:"",other:s}}
function composePay(type,bank,other){bank=(bank||"").trim();if(type==="銀行轉帳")return (bank||"銀行")+"（轉帳件）";if(type==="信用卡轉帳")return (bank||"信用卡")+"（卡扣件）";return (other||"").trim()||"自繳件"}

  <label>其他說明（選「其他」時）<input class="inp" name="payOther" value="${esc(v.other)}" placeholder="例：自繳件、業務收費"></label>`}
const REL_OPTS=["","戶長","配偶","子女","父母","兄弟姊妹","祖父母","孫子女","其他"];
const REL_ORDER={"戶長":0,"本人/戶長":0,"配偶":1,"子女":2,"父母":3,"祖父母":4,"兄弟姊妹":5,"孫子女":6,"其他":7};
function isHead(c){return c&&(c.relation==="戶長"||c.relation==="本人/戶長")}
function relName(c){return c.relation==="本人/戶長"?"戶長":(c.relation||"成員")}
function liveC(c){return M&&M.c&&c.id===M.c.id?M.c:c}
function famMembers(fam){if(!fam)return [];const arr=S.clients.filter(x=>x.family===fam).map(liveC);if(M&&M.c&&M.c.family===fam&&!arr.some(x=>x.id===M.c.id))arr.push(M.c);
  return arr.sort((a,b)=>((REL_ORDER[a.relation]??8)-(REL_ORDER[b.relation]??8))||((age(b.birthday)||0)-(age(a.birthday)||0)))}

const CO_STYLE=[["國泰","#009a44"],["全球","#c8102e"],["新光","#e4002b"],["安聯","#003781"],["富邦","#0071bc"],["南山","#00857c"],["台灣","#ef7d00"],["台壽","#ef7d00"],["中國","#b5121b"],["中壽","#b5121b"],["三商","#e95513"],["遠雄","#1d4e9e"],["凱基","#00205b"],["元大","#1a3e8c"],["第一","#0091d5"],["友邦","#d31145"],["保誠","#ed1b2e"],["宏泰","#6d2077"],["法國巴黎","#00915a"],["安達","#000000"],["全美","#5c6670"],["新安東京","#d7000f"],["和泰","#d40000"],["明台","#0067b1"]];
function coShort(n){n=String(n||"").trim();const m=CO_STYLE.find(x=>n.startsWith(x[0]));if(m)return m[0].slice(0,2);return n.replace(/(人壽|產險|產物|保險|國際).*$/,"").slice(0,2)||"？"}
function coColor(n){n=String(n||"").trim();const m=CO_STYLE.find(x=>n.startsWith(x[0]));if(m)return m[1];let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))%360;return n?`hsl(${h},45%,40%)`:"#9aa3ad"}
function coBadge(n,sz){sz=sz||22;return `<span class="cob" style="background:${coColor(n)};width:${sz}px;height:${sz}px;font-size:${Math.round(sz*0.42)}px" title="${esc(n||"")}">${esc(coShort(n))}</span>`}

function polCo(p){const c=String(p.company||"").trim(),n=String(p.product||"").trim();const m=n.match(/^(.{2,6}?)(人壽|產物|產險)/);if(m){const nm=m[1]+m[2];if(!c||!c.startsWith(m[1].slice(0,2)))return nm}return c||"未填公司"}
function byCompany(ps){const m={},order=[];ps.forEach(p=>{const k=polCo(p);if(!m[k]){m[k]=[];order.push(k)}m[k].push(p)});return order.map(k=>({co:k,items:m[k]}))}
function looksRider(n){n=String(n||"");return /附約|附加條款|豁免/.test(n)||/_\)\s*$/.test(n)}
function polCode(n){const m=String(n||"").match(/\(([A-Za-z0-9][A-Za-z0-9\-_]*)\)\s*$/);return m?m[1].toUpperCase():""}
function polKey(p){return (polCode(p.product)||stripCode(p.product||"").replace(/\s+/g,""))+"|"+(p.start||"")}
function mainsOf(g){return g.items.filter(x=>!x.rider)}
function policyGroups(ps){const g=[],map={};ps.forEach(p=>{const k=(p.policyNo||"").trim()||("_"+p.id);if(!map[k]){map[k]={no:(p.policyNo||"").trim(),items:[]};g.push(map[k])}map[k].items.push(p)});
  g.forEach(x=>x.items.sort((a,b)=>(!!a.rider-!!b.rider)||(a.start||"").localeCompare(b.start||"")));return g}
function sheetHtml(c,ps,opts){opts=opts||{};
  if(!ps.length)return "";
  return policyGroups(ps).map(g=>{const f=g.items.find(x=>!x.rider)||g.items[0];
   return `<div class="psheet"><div class="phead"><span class="no">保 單 號 碼 ▷ ${esc(g.no||"（未填）")}</span><span class="hd">要保人 <i>▶</i> <b>${esc(f.holder||c.name||"")}</b></span>${opts.check||opts.report?"":`<span class="pco pmedit" data-act="editCo" data-pid="${f.id}" title="點一下修改保險公司">${coBadge(polCo(f),20)}<span>${esc(polCo(f))}</span><span style="color:#2fa84f">✎</span></span>`}${opts.check||opts.report?`<span class="pm">${esc(f.payMethod||"")}</span>`:`<span class="pm pmedit" data-act="editPay" data-pid="${f.id}" title="點一下修改扣款方式">${esc(f.payMethod||"未填扣款方式")} <span style="color:#2fa84f">✎</span></span>`}</div>
   ${mainsOf(g).length>1&&g.no?`<div class="pwarn">⚠ 這張保單有 ${mainsOf(g).length} 個主約（${mainsOf(g).map(x=>esc(polCode(x.product)||stripCode(x.product))).join("、")}），一張保單只能有一個主約。請點該列修改保單號碼，或改成附約；也可以用原始 PDF 重新匯入並勾選「以檔案為準」。</div>`:""}
   <div class="pwrap"><table class="ptbl"><colgroup>${opts.check?'<col style="width:34px">':""}<col style="width:30%"><col style="width:8%"><col style="width:7%"><col style="width:10%"><col style="width:8%"><col style="width:10%"><col style="width:7%"><col></colgroup><thead><tr>${opts.check?"<th></th>":""}<th style="text-align:left">商品</th><th>繳費年期</th><th>對象</th><th>投保日期</th><th>保額</th><th>下期保費</th><th>繳別</th><th>受益人</th></tr></thead><tbody>
   ${g.items.map(p=>`<tr class="${p.rider?"":"main"} ${opts.check?"":"click"} ${active(p)?"":"off"}" ${opts.check?"":`data-act="editPol" data-pid="${p.id}"`}>
     ${opts.check?`<td><input type="checkbox" class="scanchk" data-i="${p._i}" checked></td>`:""}
     <td class="nm"><span class="rd">${p.rider?"○":"●"}</span>${esc(p.product||"(未命名)")}${!opts.check&&(()=>{const pr=matchProduct(p);return pr&&pr.status==="已核對"})()?` <span title="已套用商品庫給付規則" style="font-size:11px">📚</span>`:""}${opts.check?`<div><select class="inp scantype" data-i="${p._i}" style="padding:2px 6px;font-size:12px;width:auto;margin-top:4px">${PTYPES.map(t=>`<option ${t===p.type?"selected":""}>${t}</option>`).join("")}</select></div>`:(active(p)?"":` <span class="tag r">${esc(p.status)}</span>`)}</td>
     <td class="g">${num(p.payYears)?(p.payTo==="歲"?"至"+num(p.payYears)+"歲":String(num(p.payYears)).padStart(2,"0")+"年"):(fq(p)===0?"--":"")}</td><td class="g">${esc(p.target||"本人")}</td><td class="g">${esc(rocDate(p.start))}</td>
     <td class="g">${esc(sumLabel(p))}</td><td class="g">${p.premium!==""&&p.premium!=null?fmt(num(p.premium))+(isUSD(p)?"美元":"元"):""}</td><td class="g">${esc(FREQ_SHORT[fq(p)]||"")}</td><td class="bf">${esc(p.beneficiary||"")}</td></tr>`).join("")}
   </tbody></table></div></div>`}).join("");
}

const LS="stark-local-v1",CFG_KEY="stark-fb-config",MODE_KEY="stark-mode";
let FB=null,unsub=null;
function lsLoad(){try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j){S.clients=j.clients||[];S.products=j.products||[];S.profile=Object.assign(clone(DEF_PROFILE),j.profile||{})}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({clients:S.clients,products:S.products,profile:S.profile}))}catch(e){}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function col(){return FB.fs.collection("users").doc(S.uid).collection("items")}
function writeDoc(id,data){
  if(S.mode!=="cloud"){lsSave();return Promise.resolve()}
  const ref=col().doc(id);
  const run=()=>(data?ref.set(data):ref.delete()).catch(e=>{toast("儲存失敗："+(e&&e.message||e))});
  writeQ[id]=(writeQ[id]||Promise.resolve()).then(run,run);return writeQ[id];
}
function saveClient(c){c.type="client";c.updated=Date.now();const i=S.clients.findIndex(x=>x.id===c.id);if(i>=0)S.clients[i]=c;else S.clients.push(c);render();return writeDoc(c.id,clone(c))}
function delClient(id){S.clients=S.clients.filter(c=>c.id!==id);render();return writeDoc(id,null)}
function saveProduct(x){x.type="product";x.updated=Date.now();const i=S.products.findIndex(y=>y.id===x.id);if(i>=0)S.products[i]=x;else S.products.push(x);render();return writeDoc(x.id,clone(x))}
function delProduct(id){S.products=S.products.filter(x=>x.id!==id);render();return writeDoc(id,null)}
function saveProfile(){render();return writeDoc("profile",clone(S.profile))}

function parseCfg(t){
  if(!t)return null;const o={};let m;const re=/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g;
  while((m=re.exec(t)))o[m[1]]=m[2];return o.apiKey&&o.projectId?o:null;
}
function getCfg(){const w=window.STARK_FIREBASE_CONFIG;if(w&&w.apiKey)return w;try{return JSON.parse(lsGet(CFG_KEY)||"null")}catch(e){return null}}
async function initStore(){
  const cfg=getCfg();
  if(lsGet(MODE_KEY)==="local"){S.mode="local";lsLoad();setSync();render();return}
  if(!cfg||!window.firebase){S.mode="setup";setSync("尚未設定雲端");render();return}
  try{
    const app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);
    FB={app,auth:firebase.auth(),fs:firebase.firestore()};
    try{await FB.fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  }catch(e){S.mode="setup";S.cfgErr=String(e.message||e);render();return}
  FB.auth.onAuthStateChanged(u=>{
    if(unsub){unsub();unsub=null}
    if(!u){S.mode="login";S.uid=null;S.clients=[];S.profile=clone(DEF_PROFILE);setSync("未登入");render();return}
    S.uid=u.uid;S.email=u.email;S.mode="cloud";S.loaded=false;setSync("同步中…");render();
    let timer=setTimeout(()=>setSync("⚠ 目前離線，顯示手機內的資料"),10000);
    unsub=col().onSnapshot({includeMetadataChanges:true},snap=>{
      const cl=[],pr=[];let prof=null;
      snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==="profile")prof=v;else if(v.type==="client")cl.push(Object.assign({},v,{id:d.id}));else if(v.type==="product")pr.push(Object.assign({},v,{id:d.id}))});
      S.clients=cl;S.products=pr;S.profile=Object.assign(clone(DEF_PROFILE),prof||{});
      if(!snap.metadata.fromCache){clearTimeout(timer);setSync()}else if(!S.loaded)setSync("離線資料（連上網路後自動同步）");
      S.loaded=true;if(!M)render();
    },err=>{clearTimeout(timer);setSync("⚠ 同步錯誤："+(err.code||""));S.loaded=true;render()});
  });
}
function setSync(m){const el=document.getElementById("syncState");if(el)el.textContent=m||(S.mode==="cloud"?"☁ 雲端同步中｜"+(S.email||""):"💾 本機模式");}

  ${S.cfgErr?`<div class="banner err">設定有誤：${esc(S.cfgErr)}</div>`:""}

  <button class="btn ghost" style="width:100%;justify-content:center;margin-top:6px" data-act="useLocal">先用本機模式（資料只存在這台裝置）</button></div></div>`;
}

const AUTH_ERR={"auth/invalid-credential":"帳號或密碼錯誤","auth/wrong-password":"帳號或密碼錯誤","auth/user-not-found":"找不到這個帳號","auth/email-already-in-use":"這個 Email 已註冊，請直接登入","auth/weak-password":"密碼至少 6 碼","auth/invalid-email":"Email 格式不正確","auth/network-request-failed":"網路連線失敗","auth/operation-not-allowed":"Firebase 尚未開啟 Email/密碼登入","auth/too-many-requests":"嘗試太多次，請稍後再試"};

/* ========== 提醒 ========== */
function reminders(days){
  const t=today(),lim=new Date(t);lim.setDate(lim.getDate()+days);const out=[];
  S.clients.forEach(c=>{
    const b=nextBday(c.birthday);
    if(b&&b<=lim)out.push({kind:"birthday",d:b,c,t:"🎂 "+c.name+" 生日（"+(age(c.birthday)+1)+" 歲）",sub:"送上祝福，順便關心近況",msg:fill(tpl("birthday"),{name:c.name,agent:agentName()})});
    const f=pd(c.nextFollow);
    if(f&&f<=lim)out.push({kind:"follow",d:f,c,overdue:f<t,t:"📞 追蹤 "+c.name,sub:(f<t?"已逾期 "+daysBetween(f,t)+" 天｜":"")+(c.followNote||"約訪 / 回覆"),msg:fill(tpl("follow"),{name:c.name,agent:agentName()})});
    (c.policies||[]).forEach(p=>{
      const n=nextDue(p);
      if(n&&n<=lim)out.push({kind:"payment",d:n,c,t:"💳 "+c.name+"｜"+(p.product||p.type)+" 繳費",sub:(FREQ[fq(p)]||"")+" "+fmt(num(p.premium))+" 元"+(p.payMethod?"｜"+p.payMethod:""),msg:fill(tpl("payment"),{name:c.name,agent:agentName(),product:p.product||p.type,amount:fmt(num(p.premium)),date:md(n)})});
      const e=paidUpDate(p);
      if(e&&e>=t&&e<=lim&&active(p))out.push({kind:"paidup",d:e,c,t:"🎉 "+c.name+"｜"+(p.product||p.type)+" 繳費期滿",sub:"好時機：重新檢視保障",msg:fill(tpl("paidup"),{name:c.name,agent:agentName(),product:p.product||p.type,date:md(e)})});
    });
  });
  return out.sort((a,b)=>a.d-b.d);
}
const KIND={birthday:{n:"生日",c:"#e8833a"},payment:{n:"繳費",c:"#1f5a96"},paidup:{n:"期滿",c:"#2f9e6b"},follow:{n:"追蹤",c:"#d0493f"}};

/* ========== 篩選 ========== */
const FILTERS=[
  {id:"all",n:"全部",f:()=>true},
  {id:"bmonth",n:"本月壽星",f:c=>{const d=pd(c.birthday);return d&&d.getMonth()===today().getMonth()}},
  {id:"noci",n:"缺重疾/重大傷病",f:c=>cov(c).ci<=0},
  {id:"nomed",n:"缺實支實付",f:c=>cov(c).med<=0},
  {id:"noacc",n:"缺意外",f:c=>cov(c).acc<=0},
  {id:"noltc",n:"缺長照/失能",f:c=>cov(c).ltc<=0&&cov(c).dis<=0},
  {id:"cold",n:"90天未聯絡",f:c=>lastContactDays(c)>90},
  {id:"follow",n:"待追蹤",f:c=>!!c.nextFollow},
  {id:"lead",n:"潛在 / 洽談中",f:c=>c.stage==="潛在"||c.stage==="洽談中"}
];
function filtered(){
  const f=FILTERS.find(x=>x.id===S.filter)||FILTERS[0];const q=S.q.trim().toLowerCase();
  return S.clients.filter(c=>f.f(c)&&(!S.tag||(c.tags||[]).includes(S.tag))&&(!q||[c.name,c.idNo,c.phone,c.line,c.family,c.job,(c.tags||[]).join(" "),c.notes].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>(a.family||"~").localeCompare(b.family||"~","zh-Hant")||(a.name||"").localeCompare(b.name||"","zh-Hant"));
}

/* ========== 渲染 ========== */
function render(){
  const nav=document.getElementById("nav");
  nav.innerHTML=VIEWS.map(v=>`<a href="#${v.id}" class="${S.view===v.id?"on":""}"><span class="ic">${v.ic}</span>${v.n}</a>`).join("");
  document.getElementById("brandSub").textContent=S.profile.agent?"Stark Insurance CRM｜"+S.profile.agent:"Stark Insurance CRM";
  const m=document.getElementById("main");
  document.body.classList.toggle("gate",S.mode==="setup"||S.mode==="login");
  if(S.mode==="setup"){m.innerHTML=vSetupCloud();return}
  if(S.mode==="login"){m.innerHTML=vLogin();return}
  if(S.mode==="loading"||(S.mode==="cloud"&&!S.loaded)){m.innerHTML=`<div class="empty"><b>載入中…</b>正在讀取你的客戶資料</div>`;return}
  const banner=S.mode==="local"?`<div class="banner">💾 目前為<b>本機模式</b>：資料只存在這台裝置。到「設定」可以改用雲端同步，或匯出備份。</div>`:"";
  const fn={dashboard:vDash,clients:vClients,reminders:vRem,claims:vClaims,services:vSvc,ecard:vCard,setup:vSetup,products:vProducts}[S.view]||vDash;
  m.innerHTML=banner+fn();
}
function vDash(){
  const cs=S.clients;const pols=cs.flatMap(c=>(c.policies||[]).filter(active));
  const prem=cs.reduce((a,c)=>a+annualSum(c),0);const rem30=reminders(30);const rem7=reminders(7);
  const st=STAGES.map(s=>({s,n:cs.filter(c=>(c.stage||"潛在")===s).length}));

  const mx=Math.max(1,...gaps.map(g=>g.v));
  if(!cs.length)return `<div class="top"><h1>總覽</h1></div><div class="card empty"><b>還沒有客戶資料</b>先新增第一位客戶，或載入示範資料看看系統怎麼運作。<div class="row" style="justify-content:center;margin-top:16px"><button class="btn p" data-act="newClient">＋ 新增客戶</button><button class="btn" data-act="demo">載入示範資料</button></div></div>`;

  <div class="grid k4">
    <div class="card kpi"><div class="l">客戶數</div><div class="v">${cs.length}</div><div class="s">家庭 ${new Set(cs.map(c=>c.family).filter(Boolean)).size} 組</div></div>
    <div class="card kpi"><div class="l">有效保單</div><div class="v">${pols.length}</div><div class="s">平均每人 ${(pols.length/Math.max(1,cs.length)).toFixed(1)} 張</div></div>
    ${(()=>{const t=today();const t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());const lim=new Date(t0);lim.setDate(lim.getDate()+30);
      const up=cs.map(c=>{const d=pd(c.birthday);if(!d)return null;let n=new Date(t0.getFullYear(),d.getMonth()+6,d.getDate());if(n<t0)n=new Date(t0.getFullYear()+1,d.getMonth()+6,d.getDate());if(n>lim)return null;
        const ia=n.getFullYear()-d.getFullYear()-(new Date(n.getFullYear(),d.getMonth(),d.getDate())>n?1:0)+1;return {c,n,ia,days:Math.round((n-t0)/864e5)}}).filter(Boolean).sort((x,y)=>x.n-y.n);
      const bm=cs.filter(c=>{const d=pd(c.birthday);return d&&d.getMonth()===t.getMonth()}).sort((x,y)=>pd(x.birthday).getDate()-pd(y.birthday).getDate());
      const nm=(c,extra)=>`<a class="kname" data-act="openClient" data-id="${c.id}">${esc(c.name)}${extra?`<small>${extra}</small>`:""}</a>`;
      return `<div class="card kpi"><div class="l">保險年齡即將增齡（30 日內）</div><div class="v" style="color:var(--acc)">${up.length}<span class="vu">人</span></div><div class="knames">${up.length?up.map(x=>nm(x.c,`${x.n.getMonth()+1}/${x.n.getDate()} 起 ${x.ia} 歲${x.days<=7?"・剩"+x.days+"天":""}`)).join(""):`<span class="s">近 30 天沒有人增齡</span>`}</div></div>
    <div class="card kpi"><div class="l">本月生日（${t.getMonth()+1} 月）</div><div class="v">${bm.length}<span class="vu">人</span></div><div class="knames">${bm.length?bm.map(c=>nm(c,`${pd(c.birthday).getMonth()+1}/${pd(c.birthday).getDate()}`)).join(""):`<span class="s">本月沒有壽星</span>`}</div></div>`})()}
  </div>
  <div class="grid g2" style="margin-top:14px">

      ${rem7.length?rem7.slice(0,8).map(remItem).join(""):`<div class="empty" style="padding:24px">這 7 天沒有待辦 👍</div>`}</details>

      <div class="card"><h2>客戶階段</h2><div class="funnel">${st.map(x=>`<div><b>${x.n}</b><span>${x.s}</span></div>`).join("")}</div></div>
      <div class="card"><h2>保障缺口商機</h2><div class="hint" style="margin-bottom:8px">點一下直接列出名單</div>
        ${gaps.map(g=>`<div class="covrow" style="grid-template-columns:120px 1fr 50px;cursor:pointer" data-act="gapgo" data-k="${g.k}"><div class="n">${g.n}</div><div class="bar"><i class="low" style="width:${g.v/mx*100}%"></i></div><div class="x"><b>${g.v}</b> 人</div></div>`).join("")}

const COVD=[
 ["身故給付",[["d_gen","一般身故"],["d_acc","意外身故(含一般身故)"],["d_can","癌症身故(含一般身故)"]]],

 ["重疾給付",[["c_ci","重大疾病給付"],["c_sp","特定傷病"],["c_cisp","重大疾病暨特定傷病保險金"],["c_major","重大傷病"]]],
 ["癌症醫療",[["k_first","初次罹癌"],["k_early","初期或輕度癌症保險金"],["k_severe","重度癌症保險金"],["k_surg","癌症住院手術"],["k_hosp","住院日額保險金"],["k_disc","出院療養金"],["k_home","在家療養金"],["k_opd","門診保險金"]]],
 ["長照給付",[["l_once","長期照顧復健保險金(一次)"],["l_year","長期照顧保險金(分期-年)"]]],
 ["失能給付",[["x_year","失能生活扶助保險金(分期-年)"],["x_month","失能生活扶助保險金(分期-月)"],["x_acc","意外失能生活扶助保險金(分期-月)"]]]
];
const COVD_KEYS=COVD.flatMap(g=>g[1].map(i=>i[0]));
function wan(n){return n?(Math.floor(n*100)/100).toLocaleString("zh-TW")+"萬":""}
function yuan(n){return n?fmt(n)+"元":""}
function covAuto(c){const v=cov(c);return {d_gen:wan(v.life),d_acc:wan(v.life+v.acc),d_can:wan(v.life),a_hosp:yuan(v.hosp),i_hosp:yuan(v.hosp),r_misc:wan(v.med),c_ci:wan(v.ci),k_first:wan(v.cancer),l_year:wan(v.ltc*12),x_month:wan(v.dis)}}
function parseAmt(t){t=String(t||"").replace(/,/g,"").trim();if(!t||/[~～至]/.test(t))return null;const m=/^([\d.]+)\s*(萬|元)?/.exec(t);if(!m)return null;const n=parseFloat(m[1]);if(!isFinite(n))return null;return m[2]==="萬"?n*10000:n}
function fmtAmt(v){return v>=10000?wan(v/10000):yuan(v)}
function parseRange(t){t=String(t||"").replace(/,/g,"").trim();if(!t)return null;const parts=t.split(/\s*[~～至]\s*/);if(parts.length===2){const a=parseAmt(parts[0]),b=parseAmt(parts[1]);return a!=null&&b!=null?{min:a,max:b}:null}const v=parseAmt(t);return v==null?null:{min:v,max:v}}
function fmtRange(r){return r.min===r.max?fmtAmt(r.min):fmtAmt(r.min)+"~"+fmtAmt(r.max)}
function policyAuto(p){const c=p.cov||{},o={};const v=k=>num(c[k]);
  if(v("life")){o.d_gen=wan(v("life"));o.d_can=wan(v("life"))}if(v("life")||v("acc"))o.d_acc=wan(v("life")+v("acc"));
  if(v("hosp")){o.a_hosp=yuan(v("hosp"));o.i_hosp=yuan(v("hosp"))}if(v("med"))o.r_misc=wan(v("med"));if(v("ci"))o.c_ci=wan(v("ci"));if(v("cancer"))o.k_first=wan(v("cancer"));
  if(v("ltc"))o.l_year=wan(v("ltc")*12);if(v("dis"))o.x_month=wan(v("dis"));return o}
function policyCovd(p){const o=Object.assign({},p.covd||{});const pr=matchProduct(p);let ruled=false;if(pr&&pr.status==="已核對"){const rc=computeFromProduct(p,pr);ruled=Object.keys(rc).length>0;Object.keys(rc).forEach(k=>{if(!o[k])o[k]=rc[k]})}
  if(!ruled&&!Object.keys(p.covd||{}).length){const au=policyAuto(p);Object.keys(au).forEach(k=>{if(!o[k])o[k]=au[k]})}return o}
function covFromPolicies(c,k){const vals=[];(c.policies||[]).filter(active).forEach(p=>{const t=String(policyCovd(p)[k]||"").trim();if(t)vals.push({t,usd:isUSD(p)})});if(!vals.length)return "";
  let mn=0,mx=0,ok=true;vals.forEach(v=>{const r=parseRange(v.t);if(!r){ok=false;return}const k2=v.usd?usdRate():1;mn+=r.min*k2;mx+=r.max*k2});
  return ok?fmtRange({min:mn,max:mx}):vals.map(v=>v.t).join(" + ")}
function covPartsPs(ps,k){const raw=[];ps.filter(active).forEach(p=>{const t=String(policyCovd(p)[k]||"").trim();if(t)raw.push({t,usd:isUSD(p),src:stripCode(p.product||"")})});return mergeParts(raw)}
function mergeParts(raw){let mn=0,mx=0,has=false;const notes=[];raw.forEach(v=>String(v.t).split(/\s*[+＋]\s*/).forEach(part=>{part=part.trim();if(!part)return;const r=parseRange(part);if(r){const k2=v.usd?usdRate():1;mn+=r.min*k2;mx+=r.max*k2;has=true}else{const ex=notes.find(n=>n.t===part);if(ex){if(v.src&&!ex.src.includes(v.src))ex.src.push(v.src)}else notes.push({t:part,src:v.src?[v.src]:[]})}}));
  return {num:has?fmtRange({min:mn,max:mx}):"",notes}}
function covParts(c,k){let raw=[];const d=(c.covDetail||{})[k];
  if(d!=null&&d!=="")raw=[{t:String(d),usd:false,src:""}];else{(c.policies||[]).filter(active).forEach(p=>{const t=String(policyCovd(p)[k]||"").trim();if(t)raw.push({t,usd:isUSD(p),src:stripCode(p.product||"")})});if(!raw.length){const a=covAuto(c)[k];if(a)raw=[{t:a,usd:false,src:""}]}}
  return mergeParts(raw)}
/* 年金／生存金排程 */
function annuitySchedule(members){const rows=[];members.forEach(c=>(c.policies||[]).filter(active).forEach(p=>{const pr=matchProduct(p);if(!pr||!(pr.annuity||[]).length)return;
  const st=pd(p.start);if(!st)return;const base=policyBase(p);const bd=pd(c.birthday);const usd=isUSD(p);const t=String(p.sumText||"");
  pr.annuity.forEach(a=>{if(a.plan&&!t.includes(a.plan))return;const every=Math.max(1,num(a.every)||1),from=Math.max(1,num(a.from)||1);let to=num(a.to);
    const maxAge=num(a.toAge)||110;let amt=a.unit==="fixed"?num(a.a):(base!=null?base*num(a.a):0);if(!amt)return;
    for(let y=from;y<=(to||200);y+=every){const d=new Date(st.getFullYear()+y,st.getMonth(),st.getDate());const ageAt=bd?Math.floor((d-bd)/(365.2425*864e5)):null;if(!to&&ageAt!=null&&ageAt>maxAge)break;if(!to&&ageAt==null&&y>60)break;
      rows.push({c,p,year:d.getFullYear(),date:d,py:y,age:ageAt,amt,usd,label:a.label||"生存／年金保險金"})}})}));
  return rows.sort((x,y)=>x.date-y.date)}
function covVal(c,k){const d=(c.covDetail||{})[k];if(d!=null&&d!=="")return d;return covFromPolicies(c,k)||covAuto(c)[k]||""}
function mCovDetail(){const c=M.c;const au0=covAuto(c);const au={};COVD_KEYS.forEach(k=>au[k]=covFromPolicies(c,k)||au0[k]||"");
  return `<h3 style="margin-top:22px">詳細保障項目（保單健檢報表用）</h3><div class="hint" style="margin-bottom:8px">這裡填的會優先使用；空白的會用「各保單保障明細」加總，沒有的再用上方 8 大保障估算（灰字）。匯入「保障總覽」頁會自動填入。</div>
  <form id="covdForm">${COVD.map(g=>`<div class="sec" style="margin:8px 0 4px">${g[0]}</div><div class="form">${g[1].map(i=>`<label>${i[1]}<input class="inp" name="${i[0]}" value="${esc((c.covDetail||{})[i[0]]||"")}" placeholder="${esc(au[i[0]]||"")}"></label>`).join("")}</div>`).join("")}

function stripCode(n){return String(n||"").replace(/\s*[（(][A-Z0-9_]{1,6}[)）]\s*$/,"")}
function companyLabel(n){n=(n||"").trim();return n?n.replace(/(人壽|產險|保險).*$/,"")+"保單":"保單"}
function moneyCur(n,usd){return n||n===0?fmt(n)+(usd?"美元":""):""}
function monthPlan(items){const m=Array(12).fill(0);const t=today();
  items.filter(active).forEach(p=>{const f=fq(p);const st=pd(p.start);if(!f||!st||!num(p.premium))return;const end=paidUpDate(p);if(end&&end<t)return;
    for(let i=0;i<12;i++){if(((i-st.getMonth())%f+12)%f===0)m[i]+=num(p.premium)}});return m}

  <div class="rfb"><span class="rno">${no}</span><span class="rbrand"><span class="rlogo">STARK</span><span>顧問 ${esc(p.agent||"")}<br><b>${esc(p.phone||"")}</b></span></span></div></div>`}

    {id:uid(),name:"示範-王大明",gender:"男",birthday:ds(new Date(y-42,m,today().getDate()+5)),phone:"0912-000-111",job:"科技業主管",income:180,family:"示範王家",relation:"本人/戶長",stage:"已成交",source:"轉介紹",tags:["VIP","高資產"],lastContact:L(20),nextFollow:L(-3),followNote:"送家庭保障建議書",
      policies:[{id:pid(),company:"示範人壽",product:"終身壽險",type:"壽險",start:d2(m,today().getDate()+10).replace(/^\d{4}/,y-8),payYears:20,freq:12,premium:52000,payMethod:"信用卡",status:"有效",cov:{life:300}},{id:pid(),company:"示範人壽",product:"實支實付醫療",type:"醫療",start:(y-3)+"-01-15",payYears:0,freq:12,premium:9800,status:"有效",cov:{med:15,hosp:2000}}],logs:[{id:pid(),date:L(20),type:"面談",content:"討論孩子教育金規劃"}],services:[]},
    {id:uid(),name:"示範-林小美",gender:"女",birthday:ds(new Date(y-39,m,today().getDate()+12)),phone:"0922-000-222",job:"老師",family:"示範王家",relation:"配偶",stage:"已成交",tags:["新手爸媽"],lastContact:L(20),
      policies:[{id:pid(),company:"示範人壽",product:"重大傷病險",type:"重疾/重大傷病",start:(y-2)+"-"+String(m+1).padStart(2,"0")+"-25",payYears:20,freq:1,premium:1650,payMethod:"銀行轉帳",status:"有效",cov:{ci:50,cancer:30}}],logs:[],services:[{id:pid(),date:L(5),type:"理賠申請",status:"待補件",note:"住院收據已收，待補診斷書"}]},

/* ========== 事件 ========== */
function route(){const h=(location.hash||"").slice(1);S.view=VIEWS.some(v=>v.id===h)?h:"dashboard";render();try{window.scrollTo(0,0)}catch(_){}}
window.addEventListener("hashchange",route);
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
  if(a==="maskClose"){if(e.target===el)closeModal();return}
  if(el.tagName==="SELECT")return;
  switch(a){
    case "newClient":openClient(null);break;
    case "openClient":openClient(el.dataset.id,el.dataset.tab);break;
    case "toggleId":M.showId=!M.showId;applyId();break;
    case "switchClient":openClient(el.dataset.id,M.tab);break;
    case "close":closeModal();break;
    case "mtab":M.tab=el.dataset.t;M.editPol=null;drawModal();break;
    case "filter":S.filter=el.dataset.f;render();break;
    case "tagf":S.tag=S.tag===el.dataset.t?"":el.dataset.t;render();break;
    case "gapgo":S.filter={ci:"noci",med:"nomed",acc:"noacc",ltc:"noltc",life:"all"}[el.dataset.k];if(el.dataset.k==="life")S.q="";location.hash="clients";render();break;
    case "remDays":S.remDays=+el.dataset.d;render();break;
    case "copyMsg":copy(el.dataset.msg);break;
    case "bulkKind":{const rs=reminders(S.remDays).filter(r=>r.kind===el.dataset.k);openText(KIND[el.dataset.k].n+"訊息（"+rs.length+" 則）",rs.map(r=>"【"+r.c.name+(r.c.phone?" "+r.c.phone:"")+"】\n"+r.msg).join("\n\n"));break}
    case "bulkMsg":{const l=filtered();openText("群發關懷訊息（"+l.length+" 位，可先修改再複製）",l.map(c=>"【"+c.name+(c.phone?" "+c.phone:"")+"】\n"+fill(tpl("care"),{name:c.name,agent:agentName()})).join("\n\n"));break}
    case "claimSc":S.claimSc=el.dataset.k;render();break;
    case "copyClaim":copy(claimText());break;
    case "copyCard":copy(cardText());break;
    case "copyCov":copy(covSummary(M.c));break;
    case "gotoClaim":S.claimCid=M.c.id;closeModal();location.hash="claims";break;
    case "editCo":{const base=M.c.policies.find(x=>x.id===el.dataset.pid);if(!base)break;const no=(base.policyNo||"").trim();
      const grp=M.c.policies.filter(x=>no?x.policyNo===no:x.id===base.id);const cur=polCo(base);
      const opts=[...new Set(["國泰人壽","全球人壽","新光人壽","安聯人壽","富邦人壽","南山人壽","台灣人壽","中國人壽","三商美邦人壽","遠雄人壽","凱基人壽","元大人壽","友邦人壽","保誠人壽","第一金人壽","合作金庫人壽","宏泰人壽","安達人壽","法國巴黎人壽","全美人壽"].concat(S.clients.flatMap(c=>(c.policies||[]).map(p=>(p.company||"").trim())).filter(Boolean)))];
      famDialog("修改保險公司"+(no?"｜保單 "+esc(no):""),`<label class="sub">保險公司<input class="inp" name="co" list="coList" value="${esc(cur==="未填公司"?"":cur)}" placeholder="選擇或輸入"></label><datalist id="coList">${opts.map(o=>`<option value="${esc(o)}">`).join("")}</datalist><div class="hint" style="margin-top:8px">會套用到這張保單的主約與所有附約（共 ${grp.length} 項）</div>`,
        async d=>{const co=(d.co||"").trim();grp.forEach(p=>p.company=co);await commitM();drawModal();toast("已改為 "+(co||"未填公司"))});break}
    case "editPay":{const base=M.c.policies.find(x=>x.id===el.dataset.pid);if(!base)break;const no=(base.policyNo||"").trim();
      const grp=M.c.policies.filter(x=>no?x.policyNo===no:x.id===base.id);
      const box=document.createElement("div");box.innerHTML=`<div class="mask"><div class="modal sm"><div class="mh"><b>修改扣款方式${no?"｜保單 "+esc(no):""}</b><button class="btn ghost x" data-x>✕</button></div>
        <form class="mb" id="payForm"><div class="form" style="grid-template-columns:1fr">${payFields(base.payMethod)}</div><div class="hint" style="margin-top:8px">會套用到這張保單的主約與所有附約（共 ${grp.length} 項）</div>
        <div class="row" style="margin-top:14px;justify-content:flex-end"><button type="button" class="btn" data-x>取消</button><button class="btn p" type="submit">儲存</button></div></form></div></div>`;
      document.getElementById("modalRoot").appendChild(box);box.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>box.remove());
      box.querySelector("#payForm").onsubmit=async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target).entries());const pm=composePay(d.payType,d.payBank,d.payOther);
        grp.forEach(x=>x.payMethod=pm);box.remove();await commitM();drawModal();toast("扣款方式已更新："+pm)};break}
    case "famCreate":{M.c.family=M.c.name+"家";M.c.relation="戶長";await commitM();drawModal();toast("已建立「"+M.c.family+"」");break}
    case "famRename":{const old=M.c.family;famDialog("修改家庭名稱",`<input class="inp" name="name" value="${esc(old)}">`,async d=>{const nn=(d.name||"").trim();if(!nn||nn===old)return;for(const x of famMembers(old)){x.family=nn;await saveMember(x)}drawModal();toast("家庭名稱已改為「"+nn+"」")});break}
    case "famJoin":{const fams=[...new Set(S.clients.map(x=>x.family).filter(Boolean))];if(!fams.length){toast("目前還沒有其他家庭");break}
      famDialog("加入其他家庭",`<label class="sub">家庭<select class="inp" name="fam">${fams.map(f=>`<option>${esc(f)}</option>`).join("")}</select></label>${relSelect("其他")}`,async d=>{M.c.family=d.fam;M.c.relation=d.relation;await setHeadIfNeeded(d.fam,M.c);await commitM();drawModal()});break}
    case "famJoinOther":{const fam=M.c.family;const cand=S.clients.filter(x=>x.family!==fam&&x.id!==M.c.id).sort((a,b)=>(a.name||"").localeCompare(b.name||"","zh-Hant"));if(!cand.length){toast("沒有可加入的客戶");break}
      famDialog("加入現有客戶到「"+esc(fam)+"」",`<label class="sub">客戶<select class="inp" name="cid">${cand.map(x=>`<option value="${x.id}">${esc(x.name)}${x.family?"（目前在 "+esc(x.family)+"）":""}</option>`).join("")}</select></label>${relSelect("子女")}`,async d=>{const x=cById(d.cid);if(!x)return;const y=clone(x);y.family=fam;y.relation=d.relation;await setHeadIfNeeded(fam,y);await saveClient(y);drawModal();toast(y.name+" 已加入 "+fam)});break}
    case "famNew":{const fam=M.c.family;M={c:{id:uid(),name:"",stage:"已成交",tags:[],policies:[],logs:[],services:[],isNew:true,family:fam,relation:"子女",address:M.c.address||""},tab:"info",editPol:null,showId:false};drawModal();break}
    case "famMove":{const x=liveC(cById(el.dataset.id)||M.c);const fams=[...new Set(S.clients.map(y=>y.family).filter(Boolean))];
      famDialog("重新歸戶｜"+esc(x.name),`<label class="sub">歸到哪個家庭<select class="inp" name="fam">${fams.map(f=>`<option ${f===x.family?"selected":""}>${esc(f)}</option>`).join("")}<option value="__new">＋ 以 ${esc(x.name)} 為戶長另立新家庭</option><option value="__none">移出家庭（獨立）</option></select></label>${relSelect(x.relation||"其他")}`,
        async d=>{if(d.fam==="__none"){x.family="";x.relation=""}else if(d.fam==="__new"){x.family=x.name+"家";x.relation="戶長"}else{x.family=d.fam;x.relation=d.relation;await setHeadIfNeeded(d.fam,x)}await saveMember(x);drawModal();toast(x.name+" 已更新歸戶")});break}
    case "prodStarter":{const add=STARTER_PRODUCTS.filter(x=>!S.products.some(y=>y.id===x.id));for(const x of add)await saveProduct(clone(x));toast("已載入 "+add.length+" 個商品草稿，請逐一核對後啟用");break}
    case "prodCo":S.prodCo=el.dataset.c;render();break;
    case "prodNew":openProductEditor({company:S.prodCo||"國泰人壽",status:"草稿",rules:[]},true);break;
    case "prodEdit":{const x=S.products.find(y=>y.id===el.dataset.id);if(x)openProductEditor(x,false);break}
    case "prodImport":openTermsImport({co:el.dataset.co||S.prodCo||"",code:el.dataset.code||"",name:el.dataset.name||""});break;
    case "scanPol":openScan();break;
    case "report":{const c=M.c;const fam=c.family?S.clients.filter(x=>x.family===c.family):[];let saved=[1,2,4];try{saved=JSON.parse(localStorage.getItem("stark-rep-sec")||"[1,2,4]")}catch(e){}
      const OPTS=[[1,"保單明細","契約內容一覽表，依保險公司分區"],[2,"保障內容總覽","每位被保險人加總後的保障"],[3,"保障內容明細","同一張表格，改成每張保單拆開列出"],[4,"每月保費總覽","逐月保費與年繳合計"],[5,"年金給付明細","依年份列出可領的年金、生存金"]];
      const box=document.createElement("div");box.innerHTML=`<div class="mask"><div class="modal sm" style="max-width:480px"><div class="mh"><b>📄 產生保單健檢報表</b><button class="btn ghost x" data-x>✕</button></div><div class="mb">
        ${fam.length>1?`<div class="sub" style="margin-bottom:6px">對象</div><div class="row" style="gap:8px;margin-bottom:14px"><label class="repopt sm"><input type="radio" name="who" value="one"> 只有 ${esc(c.name)}</label><label class="repopt sm"><input type="radio" name="who" value="all" checked> ${esc(c.family)} 全家（${fam.length} 人）</label></div>`:""}
        <div class="sub" style="margin-bottom:6px">要輸出的內容（可複選）</div>${OPTS.map(o=>`<label class="repopt"><input type="checkbox" value="${o[0]}" ${saved.includes(o[0])?"checked":""}><span><b>${o[0]}. ${o[1]}</b><small>${o[2]}</small></span></label>`).join("")}
        <div class="row" style="margin-top:8px;gap:12px"><a href="javascript:void 0" data-alln>全選</a><a href="javascript:void 0" data-none>全不選</a></div></div>
        <div class="mf"><span class="sp"></span><button class="btn" data-x>取消</button><button class="btn p" data-go>產生報表</button></div></div></div>`;
      document.getElementById("modalRoot").appendChild(box);box.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>box.remove());
      const cbs=[...box.querySelectorAll('input[type=checkbox]')];box.querySelector("[data-alln]").onclick=()=>cbs.forEach(x=>x.checked=true);box.querySelector("[data-none]").onclick=()=>cbs.forEach(x=>x.checked=false);
      box.querySelector("[data-go]").onclick=()=>{const sec=cbs.filter(x=>x.checked).map(x=>+x.value);if(!sec.length){toast("請至少選一項");return}try{localStorage.setItem("stark-rep-sec",JSON.stringify(sec))}catch(e){}
        const w=box.querySelector('input[name=who]:checked');const mem=(fam.length>1&&(!w||w.value==="all"))?[c].concat(fam.filter(x=>x.id!==c.id)):[c];box.remove();openReport(mem,{sec})};break}
    case "newPol":M.editPol={id:"p"+uid(),_new:true,status:"有效",freq:12,cov:{},rider:"0",target:"本人"};drawModal();break;
    case "editPol":M.editPol=clone(M.c.policies.find(p=>p.id===el.dataset.pid));M.editPol.rider=M.editPol.rider?"1":"0";drawModal();break;
    case "cancelPol":M.editPol=null;drawModal();break;
    case "delPol":confirmBox("確定刪除這張保單？",async()=>{M.c.policies=M.c.policies.filter(p=>p.id!==el.dataset.pid);M.editPol=null;await commitM();drawModal();toast("已刪除保單")});break;
    case "delClient":confirmBox("確定刪除客戶「"+M.c.name+"」及其所有保單與紀錄？此動作無法復原。",async()=>{const id=M.c.id;closeModal();await delClient(id);toast("已刪除")});break;
    case "delLog":M.c.logs=M.c.logs.filter(l=>l.id!==el.dataset.lid);await commitM();drawModal();break;
    case "delSvc":M.c.services=M.c.services.filter(s=>s.id!==el.dataset.sid);await commitM();drawModal();break;
    case "exportCsv":exportCsv();break;
    case "exportPol":exportPol();break;
    case "exportJson":exportJson();break;
    case "importJson":importJson();break;
    case "demo":demo();break;
    case "useLocal":lsSet(MODE_KEY,"local");initStore();break;
    case "toCloud":lsSet(MODE_KEY,null);location.reload();break;
    case "authToggle":S.authMode=S.authMode==="reg"?"":"reg";S.authErr="";render();break;
    case "resetPw":{const em=(document.querySelector("#loginForm [name=email]")||{}).value;if(!em){S.authErr="請先輸入 Email，再按忘記密碼";render();break}
      try{await FB.auth.sendPasswordResetEmail(em);toast("已寄出重設密碼信")}catch(err){S.authErr=AUTH_ERR[err.code]||err.message;render()}break}
    case "logout":await FB.auth.signOut();location.hash="dashboard";break;
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="claimCid"){S.claimCid=t.value;render()}
  if(t.dataset.act==="svcStatus"){const s=M.c.services.find(x=>x.id===t.dataset.sid);s.status=t.value;await commitM();toast("狀態已更新")}
  if(["cDays","cCost","cMonths"].includes(t.id)){S[t.id]=num(t.value);render()}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById("q");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;const fd=Object.fromEntries(new FormData(f).entries());
  if(f.id==="cfgForm"){const c=parseCfg(fd.cfg);if(!c){S.cfgErr="看不懂這段設定，請確認有 apiKey 和 projectId";render();return}lsSet(CFG_KEY,JSON.stringify(c));lsSet(MODE_KEY,null);location.reload();return}
  if(f.id==="loginForm"){S.authErr="";const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="處理中…";
    try{if(S.authMode==="reg")await FB.auth.createUserWithEmailAndPassword(fd.email.trim(),fd.pw);else await FB.auth.signInWithEmailAndPassword(fd.email.trim(),fd.pw)}
    catch(err){S.authErr=AUTH_ERR[err.code]||err.message;render()}return}
  if(f.id==="infoForm"){
    if(!fd.name.trim()){toast("請填寫姓名");return}
    fd.idNo=(fd.idNo||"").toUpperCase().replace(/\s/g,"");
    if(fd.idNo&&idCheck(fd.idNo)===false){toast("身分證字號格式或檢查碼不正確，請再確認");return}
    if(fd.idNo&&!fd.gender&&/^[A-Z][12]/.test(fd.idNo))fd.gender=fd.idNo[1]==="1"?"男":"女";
    if(fd.idNo&&S.clients.some(x=>x.id!==M.c.id&&x.idNo===fd.idNo)){toast("這個身分證字號已經有客戶使用，請確認是否重複建檔");return}
    Object.assign(M.c,fd,{name:fd.name.trim(),tags:fd.tags.split(/[,，、]/).map(s=>s.trim()).filter(Boolean)});
    const wasNew=M.c.isNew;await commitM();toast(wasNew?"已建立客戶":"已儲存");if(wasNew){M.tab="pol"}drawModal();
  }
  if(f.id==="polForm"){
    const p=M.editPol;const c={};COV.forEach(x=>{const v=fd["cov_"+x.k];if(v!==""&&v!=null)c[x.k]=num(v)});
    const np={id:p.id,company:fd.company,product:fd.product,type:fd.type,policyNo:fd.policyNo,holder:fd.holder,status:fd.status,start:fd.start,payYears:fd.payYears,freq:+fd.freq,premium:fd.premium,payMethod:composePay(fd.payType,fd.payBank,fd.payOther),note:fd.note,cov:c,rider:fd.rider==="1",target:fd.target,sumText:fd.sumText,beneficiary:fd.beneficiary,currency:fd.currency,listPremium:fd.listPremium,covd:(()=>{const o={};COVD_KEYS.forEach(k=>{const v=(fd["cv_"+k]||"").trim();if(v)o[k]=v});return o})()};
    M.c.policies=M.c.policies||[];
    if(!np.rider&&String(np.policyNo||"").trim()){const other=M.c.policies.find(x=>x.id!==np.id&&!x.rider&&String(x.policyNo||"").trim()===String(np.policyNo).trim());
      if(other){toast(`保單號碼 ${np.policyNo} 已經有主約「${stripCode(other.product||"")}」，一張保單只能有一個主約。請改保單號碼，或把這一項設成附約。`);return}}
    if(fd.payYears!==String(p.payYears||""))delete np.payTo;else if(p.payTo)np.payTo=p.payTo;
    const i=M.c.policies.findIndex(x=>x.id===p.id);if(i>=0)M.c.policies[i]=np;else M.c.policies.push(np);
    M.editPol=null;await commitM();toast("保單已儲存");drawModal();
  }
  if(f.id==="covdForm"){M.c.covDetail={};COVD_KEYS.forEach(k=>{const v=(fd[k]||"").trim();if(v)M.c.covDetail[k]=v});await commitM();toast("詳細保障已儲存");drawModal();return}
  if(f.id==="logForm"){
    M.c.logs=M.c.logs||[];M.c.logs.push({id:"l"+uid(),date:fd.date,type:fd.type,content:fd.content});
    if(!M.c.lastContact||fd.date>M.c.lastContact)M.c.lastContact=fd.date;await commitM();drawModal();
  }
  if(f.id==="svcForm"){M.c.services=M.c.services||[];M.c.services.push({id:"s"+uid(),date:fd.date,type:fd.type,status:fd.status,note:fd.note});await commitM();drawModal();toast("已新增服務件")}
  if(f.id==="profForm"){
    const p=S.profile;["agent","title","company","phone","line","email","slogan","area","usdRate"].forEach(k=>p[k]=fd[k]||"");
    p.targets={};COV.forEach(x=>{const v=fd["t_"+x.k];if(v!=="")p.targets[x.k]=num(v)});
    p.tpl={};Object.keys(DEF_TPL).forEach(k=>{const v=(fd["tpl_"+k]||"").trim();if(v&&v!==DEF_TPL[k])p.tpl[k]=v});
    p.type="profile";await saveProfile();toast("設定已儲存");
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&M)closeModal()});

route();initStore();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!window.Capacitor){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
