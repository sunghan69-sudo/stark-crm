<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>史塔克客戶管理系統</title>
<meta name="theme-color" content="#14365c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --ink:#1b2433; --muted:#6b7686; --line:#e3e7ee;
  --pri:#14365c; --pri2:#1f5a96; --acc:#e8833a; --ok:#2f9e6b; --warn:#d9a21b; --bad:#d0493f;
  --soft:#eef3f9; --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:220px;background:var(--pri);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand b{display:block;font-size:17px;font-weight:900;letter-spacing:.5px}
.brand small{opacity:.75;font-size:11.5px;letter-spacing:1px;color:#f3b27f}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.82);text-decoration:none;padding:10px 12px;border-radius:9px;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:#fff;color:var(--pri)}
.nav .ic{width:20px;text-align:center}
.nav .nf{display:inline}.nav .ns{display:none}
.navfab{display:none;position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:58;width:50px;height:50px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:22px;line-height:1;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(10,30,60,.35);cursor:pointer;transition:opacity .2s,transform .1s}
.navfab:active{transform:scale(.94)}
.navback{display:none}
body.gate .navfab{display:none!important}
.side .foot{margin-top:auto;padding:14px 18px;font-size:12px;opacity:.7}
.main{flex:1;min-width:0;padding:26px 30px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:23px;margin:0;font-weight:900}
h2{font-size:17px;margin:0 0 12px;font-weight:700}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px}
.banner{background:#fff6e9;border:1px solid #f3d5a8;color:#7a4b10;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13.5px}
.banner.err{background:#fdeceb;border-color:#f2c0bb;color:#8a2a22}
/* cards */
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.kpi .v{font-size:27px;font-weight:900;color:var(--pri);line-height:1.2}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
/* buttons */
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c6cfdb}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.p:hover{background:var(--pri2)}
.btn.a{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.d{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.rhide{position:relative;display:inline-block}
.rhide>summary{cursor:pointer;list-style:none}
.rhide>summary::-webkit-details-marker{display:none}
.rhidebox{position:absolute;z-index:40;margin-top:6px;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(15,23,42,.16);padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-width:150px}
.rhidebox label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink,#1a2433)}
.rhidebox input{width:16px;height:16px}
.tag{display:inline-block;background:var(--soft);color:var(--pri2);border-radius:6px;padding:1px 8px;font-size:12px;margin:2px 4px 2px 0}
.tag.o{background:#fdeee2;color:#b45e1c}
.tag.g{background:#e3f4ec;color:#21794f}
.tag.r{background:#fbe5e3;color:#a8342b}
.tag.y{background:#fbf2d9;color:#8c6a0c}
/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f8fafc}
.nm{font-weight:700}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.who{display:flex;align-items:center;gap:10px}
input.inp,select.inp,textarea.inp{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff;width:100%}
input.inp:focus,select.inp:focus,textarea.inp:focus{outline:2px solid #bcd3ee;border-color:var(--pri2)}
.search{max-width:280px}
/* list items */
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .when{width:62px;text-align:center;flex-shrink:0}
.li .when b{display:block;font-size:17px;color:var(--pri)}
.li .when span{font-size:11px;color:var(--muted)}
.li .body{flex:1;min-width:0}
.li .t{font-weight:700}
.li .d{font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
/* bars */
.bar{height:9px;background:#edf0f4;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri2);border-radius:9px}
.bar i.ok{background:var(--ok)} .bar i.mid{background:var(--warn)} .bar i.low{background:var(--bad)}
.covrow{display:grid;grid-template-columns:120px 1fr 150px;gap:12px;align-items:center;padding:8px 0}
.covrow .n{font-weight:500;font-size:14px}
.covrow .x{font-size:13px;text-align:right;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(15,25,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:880px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{max-width:440px}
.mh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh .x{margin-left:auto}
.mb{padding:20px 22px}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--pri);border-bottom-color:var(--acc)}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px}
.logform{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px}
.logform .lcfull{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form .w2{grid-column:span 2}.form .w3{grid-column:1/-1}
.sec{grid-column:1/-1;font-weight:700;color:var(--pri);font-size:14px;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
.pol{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.insh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.insh b{background:#ffe2b8;padding:2px 10px;font-size:17px;border-radius:3px}
.psheet{margin-bottom:16px}
.phead{display:flex;align-items:stretch;border:1.5px solid #0f7c8a;border-radius:8px;overflow:hidden;font-size:14px;flex-wrap:wrap;background:#fff}
.phead .no{background:#0f7c8a;color:#fff;font-weight:700;padding:6px 12px;letter-spacing:1px;white-space:nowrap}
.phead .hd{padding:6px 12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.phead .hd i{font-style:normal;color:#0b6370}
.phead .pco{margin-left:auto;display:flex;align-items:center;gap:6px;padding:6px 10px;border-left:1px solid #c8e3e7;color:#333}.phead .pco+.pm{margin-left:0}
.phead .pm{margin-left:auto;padding:6px 12px;border-left:1px solid #c8e3e7;color:#333}
.pwrap{overflow-x:auto}
.ptbl{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px;min-width:680px;table-layout:fixed}
.ptbl th{font-weight:500;color:#666;font-size:12.5px;padding:6px;border-bottom:1px solid #ddd;text-align:center;white-space:nowrap}
.ptbl td{padding:8px 6px;text-align:center;border-bottom:1px solid #eee}
.ptbl tr.main td{background:#f1f4f6}
.ptbl tr.click{cursor:pointer}.ptbl tr.click:hover td{background:#e4f2f4}
.ptbl td.nm{text-align:left;font-weight:500}
.ptbl td.g{color:#0b6370;font-weight:700;word-break:break-word;overflow-wrap:anywhere;line-height:1.3}
.pmedit{cursor:pointer}.pmedit:hover{background:#e4f2f4}
.ptbl td.bf{font-size:12px;color:#0b6370;text-align:left;white-space:pre-line;min-width:110px}
.ptbl .rd{color:#0f7c8a;margin-right:6px}
.ptbl tr.off td{opacity:.4}
.rov{position:fixed;inset:0;background:#5b6573;z-index:80;display:flex;flex-direction:column}
.rbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--pri);color:#fff}
.rscroll{flex:1;overflow:auto;padding:12px 8px}
.rpages{width:794px;margin:0 auto}
.a4{width:794px;height:1123px;background:#fff;margin:0 auto 14px;padding:30px 34px 20px;display:flex;flex-direction:column;box-shadow:0 4px 18px rgba(0,0,0,.25);color:#222;font-size:13px;overflow:hidden}
.rh{display:flex;align-items:center;gap:10px;border-bottom:2px solid #0f7c8a;padding-bottom:6px;margin-bottom:10px}
.rh .ric{font-size:28px}.rh .rt{font-size:22px;font-weight:900}.rh .rsub{font-size:13px;color:#555}
.rh .rbox{margin-left:auto;border:1px solid #999;padding:2px 8px;font-size:11px;white-space:nowrap}
.rbody{flex:1;overflow:hidden}
.rco{display:flex;align-items:center;justify-content:center;gap:8px;color:#0b6370;font-weight:900;font-size:17px;border-bottom:2px solid #0f7c8a;margin:10px 0 8px;padding-bottom:5px}
.insco{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#555}
.cob{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:#fff;font-weight:800;letter-spacing:-.5px;flex:none;line-height:1}
.con{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.con.sm{gap:4px;font-size:inherit}
.cohd{display:flex;align-items:center;gap:10px;margin:14px 0 6px;padding:6px 10px;background:var(--soft,#f2f6f9);border-radius:10px;font-size:15px}.cohd .sub{margin-left:auto}
.a4 .insh{margin:4px 0 8px}.a4 .insh b{font-size:15px}
.a4 .psheet{margin-bottom:10px}.a4 .ptbl{min-width:0;font-size:12.5px}.a4 .ptbl td{padding:5px 4px}.a4 .phead{font-size:13px}
.rf{border-top:1px solid #ddd;padding-top:6px;margin-top:6px}
.rdis{color:#d0493f;font-size:10px}
.rfb{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
.rno{border:1px solid #999;padding:1px 6px;font-size:10.5px}
.rbrand{display:flex;align-items:center;gap:8px;font-size:11px;color:#333}.rbrand b{font-size:13px}
.rlogo{background:var(--pri);color:#fff;font-weight:900;letter-spacing:2px;padding:4px 8px;border-radius:5px;border-bottom:3px solid var(--acc)}
.rcov{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:10.5px}
.rcov th,.rcov td{border:1px solid #9ccbd2;padding:1px 3px;height:16px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcov .rv{font-weight:600}.rcov .rplus{color:#888;margin:0 1px}.rcov .rtxt{color:#666}
.rfn{display:inline-block;background:#0b6370;color:#fff;border-radius:3px;font-size:8.5px;font-weight:700;padding:0 3px;line-height:1.4;margin-left:2px;vertical-align:1px}
.rnh{margin:14px 0 6px;font-size:14px;font-weight:800;color:#0b6370}.rnh span{font-size:11px;font-weight:400;color:#777}
.rnt{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;line-height:1.5}
.rnt th{background:#0f7c8a;color:#fff;font-weight:700;padding:4px 6px;border:1px solid #0f7c8a;text-align:left}
.rnt td{border:1px solid #c8e3e7;padding:5px 6px;vertical-align:top}.rnt tr:nth-child(even) td{background:#f3f9fa}
.rnt .rn{color:#0b6370;font-weight:800;text-align:center}.rnt .rw{font-weight:700}.rnt .rit{color:#333}
.rnt .rl+.rl{margin-top:3px;padding-top:3px;border-top:1px dotted #c8e3e7}.rnt .rl b{display:inline-block;background:#e4f2f4;color:#0b6370;border-radius:4px;padding:0 5px;margin-right:6px;font-size:11px;font-weight:700}
.rcov .rins{background:#e4f2f4;color:#0b6370;font-size:15px;font-weight:900}
.rcov .rname{font-size:14px;font-weight:700;text-align:center}
.rcov .rg{background:#0f7c8a;color:#fff;font-weight:700;font-size:12px;line-height:1.3;white-space:normal}
.rcov td.ri{font-size:10.5px}.rcov td{text-align:center}.rcov td.ri{text-align:left}
.rcov tbody.gap td{border:0;height:4px;padding:0}
.rmon{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11.5px}
.rmon th,.rmon td{border:1px solid #9ccbd2;padding:3px 3px;text-align:center}
.rmon thead th{font-size:14px;font-weight:700}
.rmon tbody th{background:#e4f2f4;font-weight:500;text-align:left}
.rmon tr.rprod td{color:#0b6370;font-weight:700;font-size:11px;height:40px}
.rmon tr.rmh td{text-align:left;font-weight:900;font-size:15px;background:#fff;border-left:0;border-right:0}
.rmon tr.rmr td,.rmon tr.rmr th{height:34px}
.rmon .cal{display:inline-block;border:1px solid #d0493f;border-top:5px solid #d0493f;border-radius:3px;padding:0 5px;font-size:11px;background:#fff}
.famgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.famcard{border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.famcard.head{border-color:#0f7c8a}.famcard.me{background:#eef7f8}
.famcard .fn{font-size:20px;font-weight:900;color:#0b6370;text-decoration:underline;cursor:pointer}
.famcard .fr{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
.famcard .fs{font-size:12px;color:var(--muted);margin-top:4px}
.famcard .fb{text-align:right;margin-top:6px}.famcard .fb .btn{color:var(--acc)}
.famadd{display:flex;flex-direction:column;gap:8px;justify-content:center}.famadd .btn{justify-content:center;padding:12px}
.scangrp{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;background:#fcfdfc}
.scangrp .sgh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ruletbl td{padding:3px 6px}.ruletbl td.sec{padding:8px 6px 2px}.ruletbl.onlyfilled tr.blank{display:none}
.scanbox{border:2px dashed #b8c4d4;border-radius:12px;padding:22px;text-align:center;background:#f8fafc}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.thumbs img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.pol .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pol .meta{font-size:13px;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1b2433;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.msgbox{background:#f6f8fb;border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:14px}
/* e-card */
.ecard{width:100%;max-width:380px;border-radius:18px;overflow:hidden;background:linear-gradient(140deg,var(--pri) 0%,#24507e 100%);color:#fff;padding:26px 24px;position:relative;box-shadow:0 14px 40px rgba(20,54,92,.3)}
.tbl.mktg td,.tbl.mktg th{white-space:nowrap}.tbl.mktg td:nth-child(2){white-space:normal;min-width:220px}.tbl .r{text-align:right}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.hhgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.hhc{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:box-shadow .15s,transform .15s}
.hhc:hover{box-shadow:0 6px 18px rgba(15,124,138,.14);transform:translateY(-1px);border-color:#bfe0e4}
.hha{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;background:#8aa4a8}
.hha.m{background:#0f7c8a}.hha.f{background:#d9746a}
.hhb{min-width:0}.hhn{font-size:17px;font-weight:700;color:#173b40;display:flex;align-items:baseline;gap:8px}.hhage{font-size:12px;font-weight:500;color:var(--muted)}
.hhm{font-size:12px;color:var(--muted);margin-top:3px}.hhhit{font-size:12px;color:#b5651d;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg .btn{border:0;border-radius:0;background:#fff}.seg .btn.on{background:#0f7c8a;color:#fff}
.ecard:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(232,131,58,.25)}
.ecard .nmx{font-size:26px;font-weight:900}
.ecard .tt{opacity:.85;font-size:14px}
.ecard .sl{margin:16px 0;font-size:15px;border-left:3px solid var(--acc);padding-left:10px}
.ecard .ln{font-size:14px;opacity:.95;margin:3px 0}
.funnel{display:flex;gap:8px}
.funnel div{flex:1;background:var(--soft);border-radius:10px;padding:12px;text-align:center}
.funnel b{display:block;font-size:22px;color:var(--pri)}
.funnel span{font-size:12px;color:var(--muted)}
.claimtbl td:last-child,.claimtbl th:last-child{text-align:right}
.total{font-size:24px;font-weight:900;color:var(--acc)}
.hint{font-size:12.5px;color:var(--muted)}
body.gate .side{display:none}
.auth{min-height:80vh;display:flex;align-items:center;justify-content:center}
.auth .card{width:100%;max-width:420px;padding:28px}
.auth h1{font-size:22px}
.logo{display:inline-block;background:var(--pri);color:#fff;font-weight:900;letter-spacing:3px;padding:6px 12px;border-radius:8px;margin-bottom:12px;border-bottom:3px solid var(--acc)}
.eye{border:0;background:none;cursor:pointer;padding:0 4px;font-size:14px;line-height:1;vertical-align:middle}
.secure{-webkit-text-security:disc;text-security:disc}

(function(){

/* ========== 常數 ========== */
const VIEWS=[

  {k:"med",n:"實支實付",u:"萬/次",t:20},

const FREQ={12:"年繳",6:"半年繳",3:"季繳",1:"月繳",0:"躉繳"};
const STAGES=["潛在","洽談中","已成交","轉介紹來源"];
const STAGE_TAG={"潛在":"y","洽談中":"o","已成交":"g","轉介紹來源":""};
const SVC_TYPES=["理賠申請","扣款變更","契約變更","保單借款","受益人變更","其他"];
const SVC_ST=["處理中","待補件","已送件","完成"];
const LOG_TYPES=["電話","LINE","面談","送件","活動","其他"];
const DEF_TPL={
  birthday:"{name}您好～我是{agent}，祝您生日快樂🎂！新的一歲身體健康、平安順心。有任何保單或理賠問題，隨時找我喔！",
  payment:"{name}您好，我是{agent}。提醒您「{product}」保費 {amount} 元將於 {date} 繳費／扣款，麻煩先確認帳戶或信用卡額度，有任何問題隨時跟我說🙏",
  paidup:"{name}您好，我是{agent}。恭喜您「{product}」即將於 {date} 繳費期滿🎉！之後保障持續，找時間幫您一起檢視整體保障是否需要調整。",
  follow:"{name}您好，我是{agent}，最近好嗎？上次聊到的保障規劃，想跟您約個時間再幫您整理一下，這週方便嗎？",
  care:"{name}您好，我是{agent}。天氣變化大，提醒您注意身體😊 若有就醫記得保留收據與診斷書，理賠我都可以協助您處理！"
};
const DEF_PROFILE={type:"profile",agent:"",title:"",company:"",phone:"",line:"",email:"",slogan:"",area:"",targets:{},tpl:{}};

/* ========== 狀態 ========== */
let CARE_F=(()=>{try{return localStorage.getItem("stark-caref")||"all"}catch(e){return "all"}})();
const S={products:[],prodCo:"",clients:[],profile:clone(DEF_PROFILE),db:null,uid:null,mode:"loading",filter:"all",q:"",tag:"",remDays:30,claimCid:"",claimSc:"cancer",view:"dashboard"};
window.STARK_CLIENTS=()=>(S.clients||[]).map(c=>({name:c.name,gender:c.gender,birthday:c.birthday}));
const writeQ={};

/* ========== 工具 ========== */
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function num(v){const n=parseFloat(v);return isFinite(n)?n:0}
function fmt(n){return Math.round(n).toLocaleString("zh-TW")}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function pd(s){if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return null;return new Date(+m[1],+m[2]-1,+m[3])}
function ds(d){if(!d)return "";return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function md(d){return (d.getMonth()+1)+"/"+d.getDate()}
function addMonths(d,m){const r=new Date(d.getFullYear(),d.getMonth()+m,1);const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(d.getDate(),last));return r}
function daysBetween(a,b){return Math.round((b-a)/86400000)}
function age(b){const d=pd(b);if(!d)return "";const t=today();let a=t.getFullYear()-d.getFullYear();if(t<new Date(t.getFullYear(),d.getMonth(),d.getDate()))a--;return a}
function nextBday(b){const d=pd(b);if(!d)return null;const t=today();let n=new Date(t.getFullYear(),d.getMonth(),d.getDate());if(n<t)n=new Date(t.getFullYear()+1,d.getMonth(),d.getDate());return n}
function fq(p){return (p.freq===0||p.freq==="0")?0:(+p.freq||12)}
function usdRate(){return num((S.profile||{}).usdRate)||32}
function isUSD(p){const t=String(p.product||"")+" "+String(p.sumText||"");if(/美元|USD|美金/i.test(t))return true;if(p.currency!=="USD")return false;return !String(p.sumText||"").trim()||!/[萬元]/.test(String(p.sumText||""))}
function annualRaw(p){const f=fq(p);return f?num(p.premium)*(12/f):0}
function annual(p){return annualRaw(p)*(isUSD(p)?usdRate():1)}
function active(p){return !p.status||p.status==="有效"}
function paidUpDate(p){const s=pd(p.start);if(!s||num(p.payYears)<=1)return null;return addMonths(s,num(p.payYears)*12)}
function nextDue(p){
  const s=pd(p.start);if(!s||!active(p))return null;const f=fq(p);if(!f)return null;const t=today();const end=paidUpDate(p);
  let d=new Date(s);let i=0;while(d<t&&i<2000){d=addMonths(s,f*(++i))}
  if(end&&d>=end)return null;return d;
}
function cov(c){const r={};COV.forEach(x=>r[x.k]=0);(c.policies||[]).filter(active).forEach(p=>{const k=isUSD(p)?usdRate():1;COV.forEach(x=>{r[x.k]+=num((p.cov||{})[x.k])*k})});return r}
function target(k){const t=(S.profile.targets||{})[k];return t!=null&&t!==""?num(t):COV.find(x=>x.k===k).t}
function lifeTarget(c){const inc=num(c.income);return inc?Math.max(inc*10,target("life")):target("life")}
function annualSum(c){return (c.policies||[]).filter(active).reduce((a,p)=>a+annual(p),0)}
function tpl(k){return (S.profile.tpl||{})[k]||DEF_TPL[k]}
function fill(t,o){return t.replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m)}
function agentName(){return S.profile.agent||"您的保險顧問"}
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("已複製，可直接貼到 LINE");return}catch(e){}
  try{const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(ok){toast("已複製，可直接貼到 LINE");return}}catch(e){}
  openText("請手動複製",t)}
function lineUrl(t){return "https://line.me/R/msg/text/?"+encodeURIComponent(t)}
function cById(id){return S.clients.find(c=>c.id===id)}
function idCheck(v){
  v=(v||"").toUpperCase().trim();if(!v)return "";
  if(/^[A-Z]{2}\d{8}$/.test(v))return true; // 舊式居留證
  if(!/^[A-Z][1289]\d{8}$/.test(v))return false;
  const L="ABCDEFGHJKLMNPQRSTUVXYWZIO",n=L.indexOf(v[0])+10;
  let sum=Math.floor(n/10)+(n%10)*9;for(let i=1;i<9;i++)sum+=+v[i]*(9-i);sum+=+v[9];return sum%10===0;
}
function maskId(v){return v&&v.length>=6?v.slice(0,3)+"****"+v.slice(-3):(v||"")}
const BANKS=["台灣銀行","土地銀行","合作金庫","第一銀行","華南銀行","彰化銀行","兆豐銀行","國泰世華","中國信託","台北富邦","玉山銀行","台新銀行","永豐銀行","元大銀行","凱基銀行","星展銀行","渣打銀行","聯邦銀行","遠東商銀","新光銀行","上海商銀","王道銀行","安泰銀行","將來銀行","LINE Bank","樂天銀行","中華郵政"];
const PAY_TYPES=["銀行轉帳","信用卡轉帳","其他"];
function parsePay(s){s=(s||"").trim();const m=/^(.*?)[（(](轉帳件?|卡扣件?)[）)]/.exec(s);
  if(m)return {type:/卡扣/.test(m[2])?"信用卡轉帳":"銀行轉帳",bank:m[1].trim(),other:""};
  if(/信用卡|卡扣/.test(s))return {type:"信用卡轉帳",bank:s.replace(/信用卡|卡扣件?|[（()）]/g,"").trim(),other:""};
  if(/轉帳/.test(s))return {type:"銀行轉帳",bank:s.replace(/銀行轉帳|轉帳件?|[（()）]/g,"").trim(),other:""};
  return {type:"其他",bank:"",other:s}}
function composePay(type,bank,other){bank=(bank||"").trim();if(type==="銀行轉帳")return (bank||"銀行")+"（轉帳件）";if(type==="信用卡轉帳")return (bank||"信用卡")+"（卡扣件）";return (other||"").trim()||"自繳件"}
function payFields(pm){const v=parsePay(pm);return `<label>扣款方式<select class="inp" name="payType">${PAY_TYPES.map(t=>`<option ${t===v.type?"selected":""}>${t}</option>`).join("")}</select></label>
  <label>銀行 / 發卡銀行<input class="inp" name="payBank" list="banklist" value="${esc(v.bank)}" placeholder="例：台新銀行"><datalist id="banklist">${BANKS.map(b=>`<option value="${b}">`).join("")}</datalist></label>
  <label>其他說明（選「其他」時）<input class="inp" name="payOther" value="${esc(v.other)}" placeholder="例：自繳件、業務收費"></label>`}
const REL_OPTS=["","戶長","配偶","子女","父母","兄弟姊妹","祖父母","孫子女","其他"];
const REL_ORDER={"戶長":0,"本人/戶長":0,"配偶":1,"子女":2,"父母":3,"祖父母":4,"兄弟姊妹":5,"孫子女":6,"其他":7};
function isHead(c){return c&&(c.relation==="戶長"||c.relation==="本人/戶長")}
function relName(c){return c.relation==="本人/戶長"?"戶長":(c.relation||"成員")}
function liveC(c){return M&&M.c&&c.id===M.c.id?M.c:c}
function famMembers(fam){if(!fam)return [];const arr=S.clients.filter(x=>x.family===fam).map(liveC);if(M&&M.c&&M.c.family===fam&&!arr.some(x=>x.id===M.c.id))arr.push(M.c);
  return arr.sort((a,b)=>((REL_ORDER[a.relation]??8)-(REL_ORDER[b.relation]??8))||((age(b.birthday)||0)-(age(a.birthday)||0)))}
function famHead(fam){return famMembers(fam).find(isHead)||null}
function avatar(c){const a=age(c.birthday);if(a!==""&&a<18)return "🧒";return c.gender==="女"?"👩":c.gender==="男"?"👨":"🙂"}
function rocDate(s){const d=pd(s);return d?(d.getFullYear()-1911)+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0"):""}
function rocBirth(s){const d=pd(s);return d?(d.getFullYear()-1911)+"."+(d.getMonth()+1)+"."+d.getDate():""}
const FREQ_SHORT={12:"年繳",6:"半年",3:"季繳",1:"月繳",0:"躉繳"};
function sumLabel(p){if(p.sumText)return p.sumText;const c=p.cov||{};const k=COV.find(x=>num(c[x.k])>0);return k?fmt(num(c[k.k]))+(k.u==="元/日"?"元":k.u.replace("/次","").replace("/月","")):""}
const CO_STYLE=[["國泰","#009a44"],["全球","#c8102e"],["新光","#e4002b"],["安聯","#003781"],["富邦","#0071bc"],["南山","#00857c"],["台灣","#ef7d00"],["台壽","#ef7d00"],["中國","#b5121b"],["中壽","#b5121b"],["三商","#e95513"],["遠雄","#1d4e9e"],["凱基","#00205b"],["元大","#1a3e8c"],["第一","#0091d5"],["友邦","#d31145"],["保誠","#ed1b2e"],["宏泰","#6d2077"],["法國巴黎","#00915a"],["安達","#000000"],["全美","#5c6670"],["新安東京","#d7000f"],["和泰","#d40000"],["明台","#0067b1"]];
function coShort(n){n=String(n||"").trim();const m=CO_STYLE.find(x=>n.startsWith(x[0]));if(m)return m[0].slice(0,2);return n.replace(/(人壽|產險|產物|保險|國際).*$/,"").slice(0,2)||"？"}
function coColor(n){n=String(n||"").trim();const m=CO_STYLE.find(x=>n.startsWith(x[0]));if(m)return m[1];let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))%360;return n?`hsl(${h},45%,40%)`:"#9aa3ad"}
function coBadge(n,sz){sz=sz||22;return `<span class="cob" style="background:${coColor(n)};width:${sz}px;height:${sz}px;font-size:${Math.round(sz*0.42)}px" title="${esc(n||"")}">${esc(coShort(n))}</span>`}
function coName(n){return `<span class="con">${coBadge(n)}<span>${esc(n||"未填公司")}</span></span>`}
function polCo(p){const c=String(p.company||"").trim(),n=String(p.product||"").trim();const m=n.match(/^(.{2,6}?)(人壽|產物|產險)/);if(m){const nm=m[1]+m[2];if(!c||!c.startsWith(m[1].slice(0,2)))return nm}return c||"未填公司"}
function byCompany(ps){const m={},order=[];ps.forEach(p=>{const k=polCo(p);if(!m[k]){m[k]=[];order.push(k)}m[k].push(p)});return order.map(k=>({co:k,items:m[k]}))}
function looksRider(n){n=String(n||"");return /附約|附加條款|豁免/.test(n)||/_\)\s*$/.test(n)}
function polCode(n){const m=String(n||"").match(/\(([A-Za-z0-9][A-Za-z0-9\-_]*)\)\s*$/);return m?m[1].toUpperCase():""}
function polKey(p){return (polCode(p.product)||stripCode(p.product||"").replace(/\s+/g,""))+"|"+(p.start||"")}
function mainsOf(g){return g.items.filter(x=>!x.rider)}
function policyGroups(ps){const g=[],map={};ps.forEach(p=>{const k=(p.policyNo||"").trim()||("_"+p.id);if(!map[k]){map[k]={no:(p.policyNo||"").trim(),items:[]};g.push(map[k])}map[k].items.push(p)});
  g.forEach(x=>x.items.sort((a,b)=>(!!a.rider-!!b.rider)||(a.start||"").localeCompare(b.start||"")));return g}
function sheetHtml(c,ps,opts){opts=opts||{};
  if(!ps.length)return "";
  return policyGroups(ps).map(g=>{const f=g.items.find(x=>!x.rider)||g.items[0];

function sha256(s){const K=[],H=[];let n=2,c=0;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true},fr=x=>(x-Math.floor(x))*4294967296|0;

  const h=H.slice();for(let j=0;j<w.length;j+=16){const W=[];let [a,b2,c2,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){if(i<16)W[i]=w[j+i]|0;else{const x=W[i-15],y=W[i-2];W[i]=(((x>>>7|x<<25)^(x>>>18|x<<14)^(x>>>3))+W[i-7]+((y>>>17|y<<15)^(y>>>19|y<<13)^(y>>>10))+W[i-16])|0}

      hh=g;g=f;f=e;e=d+t1|0;d=c2;c2=b2;b2=a;a=t1+t2|0}

function gcalUrl(title,date,time,details){
  if(!date)return "";const d=date.replace(/-/g,"");
  const mt=String(time||"").match(/^(\d{1,2}):(\d{2})/);
  if(!mt){return "https://calendar.google.com/calendar/render?action=TEMPLATE&ctz=Asia%2FTaipei&text="+encodeURIComponent(title)+"&dates="+d+"/"+d+(details?"&details="+encodeURIComponent(details):"");}
  const sh=+mt[1],sm=mt[2];const eh=(sh+1)%24;
  const pad=n=>String(n).padStart(2,"0");
  const start=d+"T"+pad(sh)+sm+"00",end=d+"T"+pad(eh)+sm+"00";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&ctz=Asia%2FTaipei&text="+encodeURIComponent(title)+"&dates="+start+"/"+end+(details?"&details="+encodeURIComponent(details):"");}

async function invImport(file){try{const j=JSON.parse(await file.text());if(!j||j.kind!=="stark-invreport"||!Array.isArray(j.customers))throw new Error("不是投資型客戶報表資料檔");
  j.type="invreport";j.importedAt=new Date().toISOString();S.invReport=j;await writeDoc("invReport",clone(j));
  let tagged=0;const seen=new Set();for(const cu of j.customers){for(const c of invMatch(cu)){if(seen.has(c.id))continue;seen.add(c.id);if(!(c.tags||[]).includes("投資型客戶")){c.tags=[...(c.tags||[]),"投資型客戶"];await saveClient(clone(c));tagged++;}}}
  toast(`已匯入 ${j.customers.length} 位客戶（資料日期 ${j.date||""}）；標記投資型客戶 ${tagged} 位`);render()}catch(err){toast("匯入失敗："+(err.message||err))}}
async function polImport(file){try{
  const j=JSON.parse(await file.text());
  if(!j||j.kind!=="stark-policyimport"||!Array.isArray(j.policies))throw new Error("不是永旭保單匯入檔");
  const norm=s=>String(s||"").toUpperCase().replace(/\s/g,"");
  const findClient=p=>{const id=norm(p.insuredId);if(id){const h=S.clients.filter(c=>norm(c.idNo)===id);if(h.length)return h[0];}const nm=String(p.insured||"").trim();if(nm){const h=S.clients.filter(c=>String(c.name||"").trim()===nm&&!norm(c.idNo));if(h.length===1)return h[0];const h2=S.clients.filter(c=>String(c.name||"").trim()===nm);if(h2.length===1)return h2[0];}return null;};
  let added=0,dup=0,newC=0;const touched={},dupList=[],newList=[];
  for(const p of j.policies){
    let c=findClient(p);
    if(!c){c={id:uid(),type:"client",name:p.insured||"",idNo:p.insuredId||"",stage:"已成交",source:"永旭匯入",tags:[],policies:[],logs:[],services:[]};S.clients.push(c);newC++;newList.push(p.insured);}
    c.policies=c.policies||[];
    if(!(c.tags||[]).includes("永旭客戶")){c.tags=[...(c.tags||[]),"永旭客戶"];}
    touched[c.id]=c;
    if(c.policies.some(x=>String(x.policyNo||"").trim()===String(p.policyNo).trim())){dup++;dupList.push(p.company+" "+p.policyNo+"（"+p.insured+"）");continue;}
    const FQMAP={"躉":0,"月":1,"季":3,"半年":6,"年":12},lbl=String(p.freqLabel||"").replace(/繳$/,"").trim();
    const freqV=(lbl in FQMAP)?FQMAP[lbl]:(+p.freq||0);
    c.policies.push({id:uid(),company:p.company,product:"",type:"壽險",policyNo:p.policyNo,holder:p.holder||p.insured,status:"有效",start:p.start||"",payYears:"",freq:freqV,premium:+p.premium||0,payMethod:"",currency:p.currency||"TWD",sumText:"",beneficiary:"",cov:{},covd:{},rider:false,note:"永旭匯入"+(j.date?" "+j.date:"")+"（商品名稱待補）"});
    added++;touched[c.id]=c;
  }
  for(const id in touched){await saveClient(clone(touched[id]));}
  lsSave();render();
  const msg=`永旭保單匯入完成：新增 ${added} 張、跳過重複 ${dup} 張、新建客戶 ${newC} 位；相關客戶已標記「永旭客戶」標籤`;
  toast(msg);
  try{console.log("[永旭匯入]",msg);if(dupList.length)console.log("跳過重複：\n"+dupList.join("\n"));if(newList.length)console.log("新建客戶："+newList.join("、"));}catch(e){}
  alert(msg+(dup?"\n\n跳過重複保單：\n"+dupList.join("\n"):"")+(newC?"\n\n新建客戶："+newList.join("、"):""));
}catch(err){toast("匯入失敗："+(err.message||err));alert("匯入失敗："+(err.message||err))}}

    case "prodDel":{const x=S.products.find(y=>y.id===el.dataset.id);if(x)confirmBox("確定刪除商品庫裡的「"+coName(x.company)+" "+(x.code?x.code+" ":"")+(x.name||"")+"」？\n已套用這個商品的客戶會改回估算值。",async()=>{await delProduct(x.id);toast("已刪除商品")});break}
    case "rematch":{PV++;_um=null;_mc=null;const ms=allMissing();const nN=ms.filter(x=>!x.draft).length,nD=ms.filter(x=>x.draft).length;const acc=(S.needs||[]).filter(n=>n.uid!==S.uid).length;S.missF="new";render();toast("已重新比對全部保單"+(acc?`（含 ${acc} 個下線帳號上傳資料）`:"")+"：沒對應條款共 "+ms.length+" 筆（未建立 "+nN+"、草稿待核對 "+nD+"）");break}
    case "remTermTog":{const k=el.dataset.mk;const s=new Set(S.remindTerms||[]);s.has(k)?s.delete(k):s.add(k);S.remindTerms=[...s];await writeDoc("remindTerms",{type:"meta",keys:S.remindTerms});render();toast(s.has(k)?"已列入『待更新條款』":"已取消標記");break}
    case "reqTermTog":{const k=el.dataset.mk;const s=new Set(S.termReqKeys||[]);const adding=!s.has(k);adding?s.add(k):s.delete(k);S.termReqKeys=[...s];await writeDoc("termReqKeys",{type:"meta",keys:S.termReqKeys});reportNeeds(true);render();toast(adding?"已通知主管建立條款 ✅":"已取消通知");break}
    case "missTog":{const k=el.dataset.mk;const s=new Set(S.missSel||[]);s.has(k)?s.delete(k):s.add(k);S.missSel=[...s];render();break}
    case "missSelAll":{const co=S.prodCo,mf=S.missF||"",RT=new Set(S.remindTerms||[]);const m=allMissing().filter(x=>!co||x.co===co).filter(x=>{const k=x.co+"|"+(x.code||x.name);return mf==="remind"?RT.has(k):(!mf||(mf==="new"?!x.draft:!!x.draft))});S.missSel=m.map(x=>x.co+"|"+(x.code||x.name));render();break}
    case "missSelNone":{S.missSel=[];render();break}
    case "missDelSel":{const sel=new Set(S.missSel||[]);if(!sel.size)break;const picked=allMissing().filter(x=>sel.has(x.co+"|"+(x.code||x.name)));if(!picked.length)break;
      const names=picked.slice(0,8).map(x=>"・"+coName(x.co)+" "+(x.name||"")).join("\n");
      confirmBox("確定刪除所選 "+picked.length+" 筆待補商品？\n\n"+names+(picked.length>8?"\n…共 "+picked.length+" 筆":"")+"\n\n草稿會一併刪掉；未建立的會從待補清單移除（之後同一筆不再出現）。",async()=>{
        const drafts=picked.filter(x=>x.draft);for(const x of drafts){await delProduct(x.draft.id)}
        const cur=new Set(S.ignoredMissing||[]);picked.forEach(x=>cur.add(x.co+"|"+(x.code||x.name)));S.ignoredMissing=[...cur];
        await writeDoc("ignoredMissing",{type:"meta",keys:S.ignoredMissing});
        S.missSel=[];PV++;_um=null;_mc=null;render();toast("已刪除 "+picked.length+" 筆待補商品");});break}
    case "prodImport":openTermsImport({co:el.dataset.co||S.prodCo||"",code:el.dataset.code||"",name:el.dataset.name||""});break;
    case "scanPol":openScan();break;
    case "report":{const c=M.c;const fam=c.family?S.clients.filter(x=>x.family===c.family):[];let saved=[1,2,4];try{saved=JSON.parse(localStorage.getItem("stark-rep-sec")||"[1,2,4]")}catch(e){}let cv={on:true,style:"A"};try{cv=Object.assign(cv,JSON.parse(localStorage.getItem("stark-rep-cover")||"{}"))}catch(e){}
      const OPTS=[[1,"保單明細","全部保單明細，依保險公司分區"],[2,"保障內容總覽","每位被保險人加總後的保障"],[3,"保障內容明細","同一張表格，改成每張保單拆開列出"],[4,"每月保費總覽","逐月保費與年繳合計"],[5,"年金給付明細","依年份列出可領的年金、生存金"]];
      const box=document.createElement("div");box.innerHTML=`<div class="mask"><div class="modal sm" style="max-width:480px"><div class="mh"><b>📄 產生保單健檢報表</b><button class="btn ghost x" data-x>✕</button></div><div class="mb">
        ${fam.length>1?`<div class="sub" style="margin-bottom:6px">對象</div><div class="row" style="gap:8px;margin-bottom:14px"><label class="repopt sm"><input type="radio" name="who" value="one"> 只有 ${esc(c.name)}</label><label class="repopt sm"><input type="radio" name="who" value="all" checked> ${esc(c.family)} 全家（${fam.length} 人）</label></div>`:""}
        <label class="repopt"><input type="checkbox" id="cvOn" ${cv.on?"checked":""}><span><b>封面</b><small>放在第一頁，含服務人員電子名片資料</small></span></label>
        <div class="cvsw">${[["A","經典商務","linear-gradient(180deg,#16365c 0 30%,#fff 30%)"],["B","清新湖水","linear-gradient(90deg,#0f7c8a 0 10%,#fff 10%)"],["C","質感深藍","#0f2440"]].map(o=>`<label><input type="radio" name="cvStyle" value="${o[0]}" ${cv.style===o[0]?"checked":""}><i style="background:${o[2]}"></i>${o[0]} ${o[1]}</label>`).join("")}</div>
        <div class="sub" style="margin:10px 0 6px">要輸出的內容（可複選）</div>${OPTS.map(o=>`<label class="repopt"><input type="checkbox" value="${o[0]}" ${saved.includes(o[0])?"checked":""}><span><b>${o[0]}. ${o[1]}</b><small>${o[2]}</small></span></label>`).join("")}
        <div class="row" style="margin-top:8px;gap:12px"><a href="javascript:void 0" data-alln>全選</a><a href="javascript:void 0" data-none>全不選</a></div></div>
        <div class="mf"><span class="sp"></span><button class="btn" data-x>取消</button><button class="btn p" data-go>產生報表</button></div></div></div>`;
      document.getElementById("modalRoot").appendChild(box);box.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>box.remove());
      const cbs=[...box.querySelectorAll('input[type=checkbox]:not(#cvOn)')];box.querySelector("[data-alln]").onclick=()=>cbs.forEach(x=>x.checked=true);box.querySelector("[data-none]").onclick=()=>cbs.forEach(x=>x.checked=false);
      box.querySelector("[data-go]").onclick=()=>{const sec=cbs.filter(x=>x.checked).map(x=>+x.value);if(!sec.length){toast("請至少選一項");return}try{localStorage.setItem("stark-rep-sec",JSON.stringify(sec))}catch(e){}const cvOn=box.querySelector("#cvOn").checked,cvSt=(box.querySelector("input[name=cvStyle]:checked")||{}).value||"A";try{localStorage.setItem("stark-rep-cover",JSON.stringify({on:cvOn,style:cvSt}))}catch(e){}
        const w=box.querySelector('input[name=who]:checked');const mem=(fam.length>1&&(!w||w.value==="all"))?[c].concat(fam.filter(x=>x.id!==c.id)):[c];box.remove();openReport(mem,{sec,cover:cvOn?cvSt:null})};break}
    case "newPol":M.editPol={id:"p"+uid(),_new:true,status:"有效",freq:12,cov:{},rider:"0",target:"本人"};drawModal();break;
    case "editPol":M.editPol=clone(M.c.policies.find(p=>p.id===el.dataset.pid));M.editPol.rider=M.editPol.rider?"1":"0";drawModal();break;
    case "cancelPol":M.editPol=null;drawModal();break;
    case "delPol":confirmBox("確定刪除這張保單？",async()=>{M.c.policies=M.c.policies.filter(p=>p.id!==el.dataset.pid);M.editPol=null;await commitM();drawModal();toast("已刪除保單")});break;
    case "delClient":confirmBox("確定刪除客戶「"+M.c.name+"」及其所有保單與紀錄？此動作無法復原。",async()=>{const id=M.c.id;closeModal();await delClient(id);toast("已刪除")});break;
    case "delLog":M.c.logs=M.c.logs.filter(l=>l.id!==el.dataset.lid);await commitM();drawModal();break;
    case "delSvc":M.c.services=M.c.services.filter(s=>s.id!==el.dataset.sid);await commitM();drawModal();break;
    case "exportCsv":exportCsv();break;
    case "exportPol":exportPol();break;
    case "exportJson":exportJson();break;
    case "importJson":importJson();break;
    case "demo":demo();break;
    case "useLocal":lsSet(MODE_KEY,"local");initStore();break;
    case "toCloud":lsSet(MODE_KEY,null);location.reload();break;
    case "authToggle":S.authMode=S.authMode==="reg"?"":"reg";S.authErr="";render();break;
    case "resetPw":{const em=((document.querySelector("#loginForm [name=email]")||{}).value||"").trim();
      if(em.toLowerCase()===ADMIN_EMAIL){try{await FB.auth.sendPasswordResetEmail(em);toast("已寄出重設密碼信")}catch(err){S.authErr=AUTH_ERR[err.code]||err.message;render()}break}
      S.authMode="reset";S.authErr="";S.rst={email:em};render();break}
    case "rstBack":S.authMode="";S.authErr="";S.rst=null;render();break;
    case "rstCancel":lsSet("stark-reset",null);S.rst=null;S.authErr="";render();break;
    case "logout":await FB.auth.signOut();location.hash="dashboard";break;
    case "rstApprove":{const r=(S.resets||[]).find(x=>x.id===el.dataset.id);if(!r)break;const code=genCode();
      try{await FB.fs.collection("resetRequests").doc(r.id).update({status:"approved",codeHash:sha256(code+"|"+r.id),approvedAt:new Date().toISOString()});S.rcodes=S.rcodes||{};S.rcodes[r.id]=code;
        openText("重設密碼確認碼",`${r.name||""} 您好，您的「史塔克客戶管理系統」重設密碼申請已核准。\n請在 App 的「忘記密碼」畫面輸入確認碼：${code}\n輸入後系統會寄重設密碼信到 ${r.email}，請點信中連結設定新密碼。`,false)}catch(err){toast("操作失敗："+(err.code||err.message))}break}
    case "rstReject":try{await FB.fs.collection("resetRequests").doc(el.dataset.id).update({status:"rejected"});toast("已設為不通過")}catch(err){toast("操作失敗："+(err.code||err.message))}break;
    case "admApprove":case "admCopy":case "admReject":case "admDisable":case "admEnable":try{await admAction(a,el.dataset.uid)}catch(err){toast("操作失敗："+(err.code||err.message))}break;
    case "reapply":await FB.fs.collection("applications").doc(S.uid).update({status:"pending",createdAt:new Date().toISOString()}).catch(err=>toast("失敗："+(err.code||"")));break;
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="claimCid"){S.claimCid=t.value;render()}
  if(t.dataset.act==="svcStatus"){const s=M.c.services.find(x=>x.id===t.dataset.sid);s.status=t.value;await commitM();toast("狀態已更新")}
  if(["cDays","cCost","cMonths"].includes(t.id)){S[t.id]=num(t.value);render()}
});
document.addEventListener("change",e=>{if(e.target.id==="invFile"&&e.target.files&&e.target.files[0]){invImport(e.target.files[0]);e.target.value=""}});
document.addEventListener("change",e=>{if(e.target.id==="polFile"&&e.target.files&&e.target.files[0]){polImport(e.target.files[0]);e.target.value=""}});
document.addEventListener("input",e=>{if(e.target.id==="invQ"){invQ=e.target.value;const pos=e.target.selectionStart;render();const el=document.getElementById("invQ");if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}});
document.addEventListener("change",e=>{if(e.target.id==="mktgAmt"){const v=Math.max(1,num(e.target.value)||100);mktgAmt=v*10000;render()}});
document.addEventListener("change",e=>{if(e.target.id==="maskNm"){MASK=e.target.checked;try{localStorage.setItem("stark-mask",MASK?"1":"0")}catch(_){}render()}});
function onSearchInput(e){if(e.target.id==="fq"){FQ=e.target.value}else if(e.target.id==="q"){S.q=e.target.value;CSHOW=60}else return;const id=e.target.id,pos=e.target.selectionStart;render();const q=document.getElementById(id);if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}}
document.addEventListener("compositionend",e=>{if(e.target.id==="q"||e.target.id==="fq")onSearchInput(e)});
document.addEventListener("input",e=>{if((e.target.id==="q"||e.target.id==="fq")&&(e.isComposing||e.inputType==="insertCompositionText"))return;
  if(e.target.id==="fq"){FQ=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById("fq");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}return}
  if(e.target.id==="q"){S.q=e.target.value;CSHOW=60;const pos=e.target.selectionStart;render();const q=document.getElementById("q");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;const fd=Object.fromEntries(new FormData(f).entries());
  if(f.id==="rstForm"){S.authErr="";const btn=f.querySelector("button");btn.disabled=true;
    try{const ref=FB.fs.collection("resetRequests").doc();await ref.set({email:fd.email.trim().toLowerCase(),name:fd.name.trim(),phone:fd.phone.trim(),status:"pending",createdAt:new Date().toISOString()});
      lsSet("stark-reset",JSON.stringify({id:ref.id,email:fd.email.trim().toLowerCase()}));render()}catch(err){S.authErr="送出失敗："+(err.code||err.message);render()}return}
  if(f.id==="rstCodeForm"){S.authErr="";const r=rstLoad();if(!r){render();return}const code=String(fd.code||"").trim().toUpperCase();const btn=f.querySelector("button");btn.disabled=true;
    try{const d=await FB.fs.collection("resetRequests").doc(r.id).get();const v=d.exists?d.data():null;
      if(!v)throw new Error("找不到這筆申請，請重新申請");if(v.status==="rejected")throw new Error("管理員未核准這次申請");if(v.status==="used")throw new Error("這組確認碼已經使用過，請重新申請");
      if(v.status!=="approved"||!v.codeHash)throw new Error("管理員還沒核准，請稍後再試");
      if(sha256(code+"|"+r.id)!==v.codeHash)throw new Error("確認碼不正確");
      await FB.auth.sendPasswordResetEmail(r.email);await FB.fs.collection("resetRequests").doc(r.id).update({status:"used",usedAt:new Date().toISOString()}).catch(()=>{});
      lsSet("stark-reset",null);S.rst={done:r.email};render()}catch(err){S.authErr=AUTH_ERR[err.code]||err.message||String(err);render()}return}
  if(f.id==="applyForm"){S.gateErr="";try{await FB.fs.collection("applications").doc(S.uid).set({email:S.email,name:fd.name.trim(),phone:fd.phone.trim(),company:(fd.company||"").trim(),note:(fd.note||"").trim(),status:"pending",createdAt:new Date().toISOString()})}catch(err){S.gateErr="送出失敗："+(err.code||err.message);render()}return}
  if(f.id==="codeForm"){S.gateErr="";const code=String(fd.code||"").trim().toUpperCase();const btn=f.querySelector("button");btn.disabled=true;
    try{await FB.fs.collection("members").doc(S.uid).set({code,active:true,email:S.email,activatedAt:new Date().toISOString()});toast("帳號已開通，歡迎使用！")}catch(err){S.gateErr=/permission/i.test(err.code||err.message)?"確認碼不正確，或管理員尚未核准":"開通失敗："+(err.code||err.message);render()}return}
  if(f.id==="cfgForm"){const c=parseCfg(fd.cfg);if(!c){S.cfgErr="看不懂這段設定，請確認有 apiKey 和 projectId";render();return}lsSet(CFG_KEY,JSON.stringify(c));lsSet(MODE_KEY,null);location.reload();return}
  if(f.id==="loginForm"){S.authErr="";const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="處理中…";
    try{if(S.authMode==="reg")await FB.auth.createUserWithEmailAndPassword(fd.email.trim(),fd.pw);else await FB.auth.signInWithEmailAndPassword(fd.email.trim(),fd.pw)}
    catch(err){S.authErr=AUTH_ERR[err.code]||err.message;render()}return}
  if(f.id==="infoForm"){
    if(!fd.name.trim()){toast("請填寫姓名");return}
    fd.idNo=(fd.idNo||"").toUpperCase().replace(/\s/g,"");
    if(fd.idNo&&idCheck(fd.idNo)===false){toast("身分證字號格式或檢查碼不正確，請再確認");return}
    if(fd.idNo&&!fd.gender&&/^[A-Z][12]/.test(fd.idNo))fd.gender=fd.idNo[1]==="1"?"男":"女";
    if(fd.idNo&&S.clients.some(x=>x.id!==M.c.id&&x.idNo===fd.idNo)){toast("這個身分證字號已經有客戶使用，請確認是否重複建檔");return}
    Object.assign(M.c,fd,{name:fd.name.trim(),tags:fd.tags.split(/[,，、]/).map(s=>s.trim()).filter(Boolean)});
    const wasNew=M.c.isNew;await commitM();toast(wasNew?"已建立客戶":"已儲存");if(wasNew){M.tab="pol"}drawModal();
  }
  if(f.id==="polForm"){
    const p=M.editPol;const c={};COV.forEach(x=>{const v=fd["cov_"+x.k];if(v!==""&&v!=null)c[x.k]=num(v)});
    const np={id:p.id,company:fd.company,product:fd.product,type:fd.type,policyNo:fd.policyNo,holder:fd.holder,status:fd.status,start:fd.start,payYears:fd.payYears,freq:+fd.freq,premium:fd.premium,payMethod:composePay(fd.payType,fd.payBank,fd.payOther),note:fd.note,cov:c,rider:fd.rider==="1",target:fd.target,sumText:fd.sumText,beneficiary:fd.beneficiary,currency:fd.currency,listPremium:fd.listPremium,covd:(()=>{const o={};COVD_KEYS.forEach(k=>{const v=(fd["cv_"+k]||"").trim();if(v)o[k]=v});return o})()};
    M.c.policies=M.c.policies||[];
    if(!np.rider&&String(np.policyNo||"").trim()){const other=M.c.policies.find(x=>x.id!==np.id&&!x.rider&&String(x.policyNo||"").trim()===String(np.policyNo).trim());
      if(other){toast(`保單號碼 ${np.policyNo} 已經有主約「${stripCode(other.product||"")}」，一張保單只能有一個主約。請改保單號碼，或把這一項設成附約。`);return}}
    if(fd.payYears!==String(p.payYears||""))delete np.payTo;else if(p.payTo)np.payTo=p.payTo;
    const i=M.c.policies.findIndex(x=>x.id===p.id);if(i>=0)M.c.policies[i]=np;else M.c.policies.push(np);
    M.editPol=null;await commitM();toast("保單已儲存");drawModal();
  }
  if(f.id==="covdForm"){M.c.covDetail={};COVD_KEYS.forEach(k=>{const v=(fd[k]||"").trim();if(v)M.c.covDetail[k]=v});await commitM();toast("詳細保障已儲存");drawModal();return}
  if(f.id==="logForm"){
    M.c.logs=M.c.logs||[];M.c.logs.push({id:"l"+uid(),date:fd.date,time:fd.time||"",type:fd.type,content:fd.content});
    if(!M.c.lastContact||fd.date>M.c.lastContact)M.c.lastContact=fd.date;await commitM();drawModal();
    if(fd.time){toast("已新增，點該筆紀錄右側的 📅 即可加入 Google 日曆")}
  }
  if(f.id==="svcForm"){M.c.services=M.c.services||[];M.c.services.push({id:"s"+uid(),date:fd.date,type:fd.type,status:fd.status,note:fd.note});await commitM();drawModal();toast("已新增服務件")}
  if(f.id==="profForm"){
    const p=S.profile;["agent","title","company","phone","line","email","slogan","area","usdRate"].forEach(k=>p[k]=fd[k]||"");
    p.targets={};COV.forEach(x=>{const v=fd["t_"+x.k];if(v!=="")p.targets[x.k]=num(v)});
    p.tpl={};Object.keys(DEF_TPL).forEach(k=>{const v=(fd["tpl_"+k]||"").trim();if(v&&v!==DEF_TPL[k])p.tpl[k]=v});
    p.type="profile";await saveProfile();toast("設定已儲存");
  }
});

route();initStore();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!window.Capacitor){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
