<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>史塔克客戶管理系統</title>
<meta name="theme-color" content="#14365c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --ink:#1b2433; --muted:#6b7686; --line:#e3e7ee;
  --pri:#14365c; --pri2:#1f5a96; --acc:#e8833a; --ok:#2f9e6b; --warn:#d9a21b; --bad:#d0493f;
  --soft:#eef3f9; --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:220px;background:var(--pri);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand b{display:block;font-size:17px;font-weight:900;letter-spacing:.5px}
.brand small{opacity:.75;font-size:11.5px;letter-spacing:1px;color:#f3b27f}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.82);text-decoration:none;padding:10px 12px;border-radius:9px;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:#fff;color:var(--pri)}
.nav .ic{width:20px;text-align:center}
.side .foot{margin-top:auto;padding:14px 18px;font-size:12px;opacity:.7}
.main{flex:1;min-width:0;padding:26px 30px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:23px;margin:0;font-weight:900}
h2{font-size:17px;margin:0 0 12px;font-weight:700}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px}
.banner{background:#fff6e9;border:1px solid #f3d5a8;color:#7a4b10;padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13.5px}
.banner.err{background:#fdeceb;border-color:#f2c0bb;color:#8a2a22}
/* cards */
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.kpi .v{font-size:27px;font-weight:900;color:var(--pri);line-height:1.2}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
/* buttons */
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c6cfdb}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.p:hover{background:var(--pri2)}
.btn.a{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.d{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tag{display:inline-block;background:var(--soft);color:var(--pri2);border-radius:6px;padding:1px 8px;font-size:12px;margin:2px 4px 2px 0}
.tag.o{background:#fdeee2;color:#b45e1c}
.tag.g{background:#e3f4ec;color:#21794f}
.tag.r{background:#fbe5e3;color:#a8342b}
.tag.y{background:#fbf2d9;color:#8c6a0c}
/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:#f8fafc}
.nm{font-weight:700}
.av{width:34px;height:34px;border-radius:50%;background:var(--soft);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.who{display:flex;align-items:center;gap:10px}
input.inp,select.inp,textarea.inp{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff;width:100%}
input.inp:focus,select.inp:focus,textarea.inp:focus{outline:2px solid #bcd3ee;border-color:var(--pri2)}
.search{max-width:280px}
/* list items */
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .when{width:62px;text-align:center;flex-shrink:0}
.li .when b{display:block;font-size:17px;color:var(--pri)}
.li .when span{font-size:11px;color:var(--muted)}
.li .body{flex:1;min-width:0}
.li .t{font-weight:700}
.li .d{font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
/* bars */
.bar{height:9px;background:#edf0f4;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri2);border-radius:9px}
.bar i.ok{background:var(--ok)} .bar i.mid{background:var(--warn)} .bar i.low{background:var(--bad)}
.covrow{display:grid;grid-template-columns:120px 1fr 150px;gap:12px;align-items:center;padding:8px 0}
.covrow .n{font-weight:500;font-size:14px}
.covrow .x{font-size:13px;text-align:right;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(15,25,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:880px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.sm{max-width:440px}
.mh{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh .x{margin-left:auto}
.mb{padding:20px 22px}
.mf{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--pri);border-bottom-color:var(--acc)}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form .w2{grid-column:span 2}.form .w3{grid-column:1/-1}
.sec{grid-column:1/-1;font-weight:700;color:var(--pri);font-size:14px;margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
.pol{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.insh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.insh b{background:#fff36b;padding:2px 10px;font-size:17px;border-radius:3px}
.psheet{margin-bottom:16px}
.phead{display:flex;align-items:stretch;border:1.5px solid #2fa84f;border-radius:8px;overflow:hidden;font-size:14px;flex-wrap:wrap;background:#fff}
.phead .no{background:#2fa84f;color:#fff;font-weight:700;padding:6px 12px;letter-spacing:1px;white-space:nowrap}
.phead .hd{padding:6px 12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.phead .hd i{font-style:normal;color:#1f8a3c}
.phead .pm{margin-left:auto;padding:6px 12px;border-left:1px solid #cfe9d6;color:#333}
.pwrap{overflow-x:auto}
.ptbl{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px;min-width:680px;table-layout:fixed}
.ptbl th{font-weight:500;color:#666;font-size:12.5px;padding:6px;border-bottom:1px solid #ddd;text-align:center;white-space:nowrap}
.ptbl td{padding:8px 6px;text-align:center;border-bottom:1px solid #eee}
.ptbl tr.main td{background:#f1f3f1}
.ptbl tr.click{cursor:pointer}.ptbl tr.click:hover td{background:#e8f5ec}
.ptbl td.nm{text-align:left;font-weight:500}
.ptbl td.g{color:#1f8a3c;font-weight:700;white-space:nowrap}
.ptbl td.bf{font-size:12px;color:#1f8a3c;text-align:left;white-space:pre-line;min-width:110px}
.ptbl .rd{color:#2fa84f;margin-right:6px}
.ptbl tr.off td{opacity:.4}
.rov{position:fixed;inset:0;background:#5b6573;z-index:80;display:flex;flex-direction:column}
.rbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--pri);color:#fff}
.rscroll{flex:1;overflow:auto;padding:12px 8px}
.rpages{width:794px;margin:0 auto}
.a4{width:794px;height:1123px;background:#fff;margin:0 auto 14px;padding:30px 34px 20px;display:flex;flex-direction:column;box-shadow:0 4px 18px rgba(0,0,0,.25);color:#222;font-size:13px;overflow:hidden}
.rh{display:flex;align-items:center;gap:10px;border-bottom:2px solid #2fa84f;padding-bottom:6px;margin-bottom:10px}
.rh .ric{font-size:28px}.rh .rt{font-size:22px;font-weight:900}.rh .rsub{font-size:13px;color:#555}
.rh .rbox{margin-left:auto;border:1px solid #999;padding:2px 8px;font-size:11px;white-space:nowrap}
.rbody{flex:1;overflow:hidden}
.rco{text-align:center;color:#1f8a3c;font-weight:900;font-size:17px;border-bottom:1px solid #2fa84f;margin:2px 0 8px;padding-bottom:4px}
.a4 .insh{margin:4px 0 8px}.a4 .insh b{font-size:15px}
.a4 .psheet{margin-bottom:10px}.a4 .ptbl{min-width:0;font-size:12.5px}.a4 .ptbl td{padding:5px 4px}.a4 .phead{font-size:13px}
.rf{border-top:1px solid #ddd;padding-top:6px;margin-top:6px}
.rdis{color:#d0493f;font-size:10px}
.rfb{display:flex;align-items:flex-end;justify-content:space-between;margin-top:6px}
.rno{border:1px solid #999;padding:1px 6px;font-size:10.5px}
.rbrand{display:flex;align-items:center;gap:8px;font-size:11px;color:#333}.rbrand b{font-size:13px}
.rlogo{background:var(--pri);color:#fff;font-weight:900;letter-spacing:2px;padding:4px 8px;border-radius:5px;border-bottom:3px solid var(--acc)}
.rcov{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:10.5px}
.rcov th,.rcov td{border:1px solid #9fd4ad;padding:1px 3px;height:16px;line-height:1.25;white-space:nowrap;overflow:hidden}
.rcov .rins{background:#eaf6ee;color:#1f8a3c;font-size:15px;font-weight:900}
.rcov .rname{font-size:14px;font-weight:700;text-align:center}
.rcov .rg{background:#2fa84f;color:#fff;font-weight:700;font-size:12px;line-height:1.3;white-space:normal}
.rcov td.ri{font-size:10.5px}.rcov td{text-align:center}.rcov td.ri{text-align:left}
.rcov tbody.gap td{border:0;height:4px;padding:0}
.rmon{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11.5px}
.rmon th,.rmon td{border:1px solid #9fd4ad;padding:3px 3px;text-align:center}
.rmon thead th{font-size:14px;font-weight:700}
.rmon tbody th{background:#eaf6ee;font-weight:500;text-align:left}
.rmon tr.rprod td{color:#1f8a3c;font-weight:700;font-size:11px;height:40px}
.rmon tr.rmh td{text-align:left;font-weight:900;font-size:15px;background:#fff;border-left:0;border-right:0}
.rmon tr.rmr td,.rmon tr.rmr th{height:34px}
.rmon .cal{display:inline-block;border:1px solid #d0493f;border-top:5px solid #d0493f;border-radius:3px;padding:0 5px;font-size:11px;background:#fff}
.scanbox{border:2px dashed #b8c4d4;border-radius:12px;padding:22px;text-align:center;background:#f8fafc}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.thumbs img{width:90px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.pol .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pol .meta{font-size:13px;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1b2433;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.msgbox{background:#f6f8fb;border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font-size:14px}
/* e-card */
.ecard{width:100%;max-width:380px;border-radius:18px;overflow:hidden;background:linear-gradient(140deg,var(--pri) 0%,#24507e 100%);color:#fff;padding:26px 24px;position:relative;box-shadow:0 14px 40px rgba(20,54,92,.3)}
.ecard:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(232,131,58,.25)}
.ecard .nmx{font-size:26px;font-weight:900}
.ecard .tt{opacity:.85;font-size:14px}
.ecard .sl{margin:16px 0;font-size:15px;border-left:3px solid var(--acc);padding-left:10px}
.ecard .ln{font-size:14px;opacity:.95;margin:3px 0}
.funnel{display:flex;gap:8px}
.funnel div{flex:1;background:var(--soft);border-radius:10px;padding:12px;text-align:center}
.funnel b{display:block;font-size:22px;color:var(--pri)}
.funnel span{font-size:12px;color:var(--muted)}
.claimtbl td:last-child,.claimtbl th:last-child{text-align:right}
.total{font-size:24px;font-weight:900;color:var(--acc)}
.hint{font-size:12.5px;color:var(--muted)}
body.gate .side{display:none}
.auth{min-height:80vh;display:flex;align-items:center;justify-content:center}
.auth .card{width:100%;max-width:420px;padding:28px}
.auth h1{font-size:22px}
.logo{display:inline-block;background:var(--pri);color:#fff;font-weight:900;letter-spacing:3px;padding:6px 12px;border-radius:8px;margin-bottom:12px;border-bottom:3px solid var(--acc)}
.eye{border:0;background:none;cursor:pointer;padding:0 4px;font-size:14px;line-height:1;vertical-align:middle}
.secure{-webkit-text-security:disc;text-security:disc}
.btn.line{background:#06c755;border-color:#06c755;color:#fff}
@media (max-width:900px){
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;flex-direction:row;z-index:40}
  .brand,.side .foot{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%;padding:6px}
  .nav a{flex-direction:column;gap:0;font-size:11px;padding:6px 4px}
  .nav a.on{background:rgba(255,255,255,.15);color:#fff}
  .main{padding:18px 14px 90px}
  .k4{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .form{grid-template-columns:1fr 1fr}
  .covrow{grid-template-columns:90px 1fr;}
  .covrow .x{grid-column:1/-1;text-align:left}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>史塔克客戶管理系統</b><small id="brandSub">Stark Insurance CRM</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="syncState">連線中…</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="modalRoot"></div>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="vendor/stark-ai.js" defer></script>
<script src="vendor/jspdf.umd.min.js" defer></script>
<script src="vendor/html2canvas.min.js" defer></script>
<script src="firebase-config.js"></script>
<script>
(function(){
"use strict";
/* ========== 常數 ========== */
const VIEWS=[
  {id:"dashboard",ic:"▦",n:"總覽"},
  {id:"clients",ic:"👥",n:"客戶"},
  {id:"reminders",ic:"🔔",n:"提醒"},
  {id:"claims",ic:"🧮",n:"怎麼賠"},
  {id:"ecard",ic:"🪪",n:"名片"},
  {id:"setup",ic:"⚙",n:"設定"}
];
const COV=[
  {k:"life",n:"壽險身故",u:"萬",t:300},
  {k:"acc",n:"意外身故失能",u:"萬",t:300},
  {k:"med",n:"實支實付",u:"萬/次",t:20},
  {k:"hosp",n:"住院日額",u:"元/日",t:2000},
  {k:"ci",n:"重大傷病/重疾",u:"萬",t:100},
  {k:"cancer",n:"癌症一次金",u:"萬",t:50},
  {k:"dis",n:"失能扶助",u:"萬/月",t:3},
  {k:"ltc",n:"長照",u:"萬/月",t:3}
];
const PTYPES=["壽險","醫療","重疾/重大傷病","癌症","意外","失能","長照","儲蓄/年金","投資型","產險","其他"];
const FREQ={12:"年繳",6:"半年繳",3:"季繳",1:"月繳",0:"躉繳"};
const STAGES=["潛在","洽談中","已成交","轉介紹來源"];
const STAGE_TAG={"潛在":"y","洽談中":"o","已成交":"g","轉介紹來源":""};
const SVC_TYPES=["理賠申請","扣款變更","契約變更","保單借款","受益人變更","其他"];
const SVC_ST=["處理中","待補件","已送件","完成"];
const LOG_TYPES=["電話","LINE","面談","送件","活動","其他"];
const DEF_TPL={
  birthday:"{name}您好～我是{agent}，祝您生日快樂🎂！新的一歲身體健康、平安順心。有任何保單或理賠問題，隨時找我喔！",
  payment:"{name}您好，我是{agent}。提醒您「{product}」保費 {amount} 元將於 {date} 繳費／扣款，麻煩先確認帳戶或信用卡額度，有任何問題隨時跟我說🙏",
  paidup:"{name}您好，我是{agent}。恭喜您「{product}」即將於 {date} 繳費期滿🎉！之後保障持續，找時間幫您一起檢視整體保障是否需要調整。",
  follow:"{name}您好，我是{agent}，最近好嗎？上次聊到的保障規劃，想跟您約個時間再幫您整理一下，這週方便嗎？",
  care:"{name}您好，我是{agent}。天氣變化大，提醒您注意身體😊 若有就醫記得保留收據與診斷書，理賠我都可以協助您處理！"
};
const DEF_PROFILE={type:"profile",agent:"",title:"",company:"",phone:"",line:"",email:"",slogan:"",area:"",targets:{},tpl:{}};

/* ========== 狀態 ========== */
const S={clients:[],profile:clone(DEF_PROFILE),db:null,uid:null,mode:"loading",filter:"all",q:"",tag:"",remDays:30,claimCid:"",claimSc:"cancer",view:"dashboard"};
const writeQ={};

/* ========== 工具 ========== */
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function num(v){const n=parseFloat(v);return isFinite(n)?n:0}
function fmt(n){return Math.round(n).toLocaleString("zh-TW")}
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function pd(s){if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return null;return new Date(+m[1],+m[2]-1,+m[3])}
function ds(d){if(!d)return "";return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function md(d){return (d.getMonth()+1)+"/"+d.getDate()}
function addMonths(d,m){const r=new Date(d.getFullYear(),d.getMonth()+m,1);const last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(d.getDate(),last));return r}
function daysBetween(a,b){return Math.round((b-a)/86400000)}
function age(b){const d=pd(b);if(!d)return "";const t=today();let a=t.getFullYear()-d.getFullYear();if(t<new Date(t.getFullYear(),d.getMonth(),d.getDate()))a--;return a}
function nextBday(b){const d=pd(b);if(!d)return null;const t=today();let n=new Date(t.getFullYear(),d.getMonth(),d.getDate());if(n<t)n=new Date(t.getFullYear()+1,d.getMonth(),d.getDate());return n}
function fq(p){return (p.freq===0||p.freq==="0")?0:(+p.freq||12)}
function usdRate(){return num((S.profile||{}).usdRate)||32}
function isUSD(p){return p.currency==="USD"}
function annualRaw(p){const f=fq(p);return f?num(p.premium)*(12/f):0}
function annual(p){return annualRaw(p)*(isUSD(p)?usdRate():1)}
function active(p){return !p.status||p.status==="有效"}
function paidUpDate(p){const s=pd(p.start);if(!s||num(p.payYears)<=1)return null;return addMonths(s,num(p.payYears)*12)}
function nextDue(p){
  const s=pd(p.start);if(!s||!active(p))return null;const f=fq(p);if(!f)return null;const t=today();const end=paidUpDate(p);
  let d=new Date(s);let i=0;while(d<t&&i<2000){d=addMonths(s,f*(++i))}
  if(end&&d>=end)return null;return d;
}
function cov(c){const r={};COV.forEach(x=>r[x.k]=0);(c.policies||[]).filter(active).forEach(p=>{const k=isUSD(p)?usdRate():1;COV.forEach(x=>{r[x.k]+=num((p.cov||{})[x.k])*k})});return r}
function target(k){const t=(S.profile.targets||{})[k];return t!=null&&t!==""?num(t):COV.find(x=>x.k===k).t}
function lifeTarget(c){const inc=num(c.income);return inc?Math.max(inc*10,target("life")):target("life")}
function annualSum(c){return (c.policies||[]).filter(active).reduce((a,p)=>a+annual(p),0)}
function tpl(k){return (S.profile.tpl||{})[k]||DEF_TPL[k]}
function fill(t,o){return t.replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m)}
function agentName(){return S.profile.agent||"您的保險顧問"}
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast("已複製，可直接貼到 LINE");return}catch(e){}
  try{const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();if(ok){toast("已複製，可直接貼到 LINE");return}}catch(e){}
  openText("請手動複製",t)}
function lineUrl(t){return "https://line.me/R/msg/text/?"+encodeURIComponent(t)}
function cById(id){return S.clients.find(c=>c.id===id)}
function idCheck(v){
  v=(v||"").toUpperCase().trim();if(!v)return "";
  if(/^[A-Z]{2}\d{8}$/.test(v))return true; // 舊式居留證
  if(!/^[A-Z][1289]\d{8}$/.test(v))return false;
  const L="ABCDEFGHJKLMNPQRSTUVXYWZIO",n=L.indexOf(v[0])+10;
  let sum=Math.floor(n/10)+(n%10)*9;for(let i=1;i<9;i++)sum+=+v[i]*(9-i);sum+=+v[9];return sum%10===0;
}
function maskId(v){return v&&v.length>=6?v.slice(0,3)+"****"+v.slice(-3):(v||"")}
function rocDate(s){const d=pd(s);return d?(d.getFullYear()-1911)+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0"):""}
function rocBirth(s){const d=pd(s);return d?(d.getFullYear()-1911)+"."+(d.getMonth()+1)+"."+d.getDate():""}
const FREQ_SHORT={12:"年繳",6:"半年",3:"季繳",1:"月繳",0:"躉繳"};
function sumLabel(p){if(p.sumText)return p.sumText;const c=p.cov||{};const k=COV.find(x=>num(c[x.k])>0);return k?fmt(num(c[k.k]))+(k.u==="元/日"?"元":k.u.replace("/次","").replace("/月","")):""}

   </tbody></table></div></div>`}).join("");

function lastContactDays(c){const d=pd(c.lastContact);return d?daysBetween(d,today()):9999}

/* ========== 儲存層（Firebase 雲端同步 / 本機模式） ========== */
const LS="stark-local-v1",CFG_KEY="stark-fb-config",MODE_KEY="stark-mode";
let FB=null,unsub=null;
function lsLoad(){try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j){S.clients=j.clients||[];S.profile=Object.assign(clone(DEF_PROFILE),j.profile||{})}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({clients:S.clients,profile:S.profile}))}catch(e){}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function col(){return FB.fs.collection("users").doc(S.uid).collection("items")}
function writeDoc(id,data){
  if(S.mode!=="cloud"){lsSave();return Promise.resolve()}
  const ref=col().doc(id);
  const run=()=>(data?ref.set(data):ref.delete()).catch(e=>{toast("儲存失敗："+(e&&e.message||e))});
  writeQ[id]=(writeQ[id]||Promise.resolve()).then(run,run);return writeQ[id];
}
function saveClient(c){c.type="client";c.updated=Date.now();const i=S.clients.findIndex(x=>x.id===c.id);if(i>=0)S.clients[i]=c;else S.clients.push(c);render();return writeDoc(c.id,clone(c))}
function delClient(id){S.clients=S.clients.filter(c=>c.id!==id);render();return writeDoc(id,null)}
function saveProfile(){render();return writeDoc("profile",clone(S.profile))}

function parseCfg(t){
  if(!t)return null;const o={};let m;const re=/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g;
  while((m=re.exec(t)))o[m[1]]=m[2];return o.apiKey&&o.projectId?o:null;
}
function getCfg(){const w=window.STARK_FIREBASE_CONFIG;if(w&&w.apiKey)return w;try{return JSON.parse(lsGet(CFG_KEY)||"null")}catch(e){return null}}
async function initStore(){
  const cfg=getCfg();
  if(lsGet(MODE_KEY)==="local"){S.mode="local";lsLoad();setSync();render();return}
  if(!cfg||!window.firebase){S.mode="setup";setSync("尚未設定雲端");render();return}
  try{
    const app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);
    FB={app,auth:firebase.auth(),fs:firebase.firestore()};
    try{await FB.fs.enablePersistence({synchronizeTabs:true})}catch(e){}
  }catch(e){S.mode="setup";S.cfgErr=String(e.message||e);render();return}
  FB.auth.onAuthStateChanged(u=>{
    if(unsub){unsub();unsub=null}
    if(!u){S.mode="login";S.uid=null;S.clients=[];S.profile=clone(DEF_PROFILE);setSync("未登入");render();return}
    S.uid=u.uid;S.email=u.email;S.mode="cloud";S.loaded=false;setSync("同步中…");render();
    let timer=setTimeout(()=>setSync("⚠ 目前離線，顯示手機內的資料"),10000);
    unsub=col().onSnapshot({includeMetadataChanges:true},snap=>{
      const cl=[];let prof=null;
      snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==="profile")prof=v;else if(v.type==="client")cl.push(Object.assign({},v,{id:d.id}))});
      S.clients=cl;S.profile=Object.assign(clone(DEF_PROFILE),prof||{});
      if(!snap.metadata.fromCache){clearTimeout(timer);setSync()}else if(!S.loaded)setSync("離線資料（連上網路後自動同步）");
      S.loaded=true;if(!M)render();
    },err=>{clearTimeout(timer);setSync("⚠ 同步錯誤："+(err.code||""));S.loaded=true;render()});
  });
}
function setSync(m){const el=document.getElementById("syncState");if(el)el.textContent=m||(S.mode==="cloud"?"☁ 雲端同步中｜"+(S.email||""):"💾 本機模式");}

/* ========== 提醒 ========== */
function reminders(days){
  const t=today(),lim=new Date(t);lim.setDate(lim.getDate()+days);const out=[];
  S.clients.forEach(c=>{
    const b=nextBday(c.birthday);
    if(b&&b<=lim)out.push({kind:"birthday",d:b,c,t:"🎂 "+c.name+" 生日（"+(age(c.birthday)+1)+" 歲）",sub:"送上祝福，順便關心近況",msg:fill(tpl("birthday"),{name:c.name,agent:agentName()})});
    const f=pd(c.nextFollow);
    if(f&&f<=lim)out.push({kind:"follow",d:f,c,overdue:f<t,t:"📞 追蹤 "+c.name,sub:(f<t?"已逾期 "+daysBetween(f,t)+" 天｜":"")+(c.followNote||"約訪 / 回覆"),msg:fill(tpl("follow"),{name:c.name,agent:agentName()})});
    (c.policies||[]).forEach(p=>{
      const n=nextDue(p);
      if(n&&n<=lim)out.push({kind:"payment",d:n,c,t:"💳 "+c.name+"｜"+(p.product||p.type)+" 繳費",sub:(FREQ[fq(p)]||"")+" "+fmt(num(p.premium))+" 元"+(p.payMethod?"｜"+p.payMethod:""),msg:fill(tpl("payment"),{name:c.name,agent:agentName(),product:p.product||p.type,amount:fmt(num(p.premium)),date:md(n)})});
      const e=paidUpDate(p);
      if(e&&e>=t&&e<=lim&&active(p))out.push({kind:"paidup",d:e,c,t:"🎉 "+c.name+"｜"+(p.product||p.type)+" 繳費期滿",sub:"好時機：重新檢視保障",msg:fill(tpl("paidup"),{name:c.name,agent:agentName(),product:p.product||p.type,date:md(e)})});
    });
  });
  return out.sort((a,b)=>a.d-b.d);
}

function render(){

  nav.innerHTML=VIEWS.map(v=>`<a href="#${v.id}" class="${S.view===v.id?"on":""}"><span class="ic">${v.ic}</span>${v.n}</a>`).join("");
  document.getElementById("brandSub").textContent=S.profile.agent?"Stark Insurance CRM｜"+S.profile.agent:"Stark Insurance CRM";
  const m=document.getElementById("main");
  document.body.classList.toggle("gate",S.mode==="setup"||S.mode==="login");
  if(S.mode==="setup"){m.innerHTML=vSetupCloud();return}
  if(S.mode==="login"){m.innerHTML=vLogin();return}
  if(S.mode==="loading"||(S.mode==="cloud"&&!S.loaded)){m.innerHTML=`<div class="empty"><b>載入中…</b>正在讀取你的客戶資料</div>`;return}
  const banner=S.mode==="local"?`<div class="banner">💾 目前為<b>本機模式</b>：資料只存在這台裝置。到「設定」可以改用雲端同步，或匯出備份。</div>`:"";
  const fn={dashboard:vDash,clients:vClients,reminders:vRem,claims:vClaims,services:vSvc,ecard:vCard,setup:vSetup}[S.view]||vDash;
  m.innerHTML=banner+fn();
}

function stripCode(n){return String(n||"").replace(/\s*[（(][A-Z0-9_]{1,6}[)）]\s*$/,"")}
function companyLabel(n){n=(n||"").trim();return n?n.replace(/(人壽|產險|保險).*$/,"")+"保單":"保單"}
function moneyCur(n,usd){return n||n===0?fmt(n)+(usd?"美元":""):""}
function monthPlan(items){const m=Array(12).fill(0);const t=today();
  items.filter(active).forEach(p=>{const f=fq(p);const st=pd(p.start);if(!f||!st||!num(p.premium))return;const end=paidUpDate(p);if(end&&end<t)return;
    for(let i=0;i<12;i++){if(((i-st.getMonth())%f+12)%f===0)m[i]+=num(p.premium)}});return m}
function rptFoot(no){const p=S.profile;return `<div class="rf"><div class="rdis">＊表列資料僅供參考，詳細內容、費率、理賠或滿期金等保障，以保險公司實際保單條款為準。外幣保單金額以原幣別列示。</div>

function buildReport(members){
  const no="S"+ds(today()).replace(/-/g,"")+String(new Date().getHours()).padStart(2,"0")+String(new Date().getMinutes()).padStart(2,"0");
  const sections=[];
  // 1. 契約內容一覽表
  const blocks=[];
  members.forEach(c=>{const ps=(c.policies||[]);if(!ps.length)return;
    const byCo={};ps.forEach(p=>{const k=companyLabel(p.company);(byCo[k]=byCo[k]||[]).push(p)});
    Object.keys(byCo).forEach(co=>{
      blocks.push(`<div class="rco">${esc(co)}</div><div class="insh"><b>被保險人: ${esc(c.name)}</b>${c.gender?`<span>${c.gender==="女"?"小姐":"先生"}</span>`:""}${c.birthday?`<span>🎂 ${esc(rocBirth(c.birthday))}</span>`:""}</div>`);
      policyGroups(byCo[co]).forEach(g=>blocks.push(sheetHtml(c,g.items)));
    })});
  sections.push({title:"契約內容一覽表-完整版",blocks:blocks.length?blocks:['<div class="empty">尚無保單資料</div>']});

    sections.push({title:"當年度保障總覽-精簡版",sub:"",blocks:[`<table class="rcov"><colgroup><col style="width:42px"><col style="width:190px"><col span="5"></colgroup><thead><tr><th colspan="2" class="rins">被保險人</th>${cs.map(c=>`<th class="rname">${c?esc(c.name):""}</th>`).join("")}</tr></thead>
      ${COVD.map(g=>`<tbody class="rgrp">${g[1].map((it,j)=>`<tr>${j===0?`<th rowspan="${g[1].length}" class="rg">${g[0].slice(0,2)}<br>${g[0].slice(2)}</th>`:""}<td class="ri">${it[1]}</td>${cs.map(c=>`<td>${c?esc(covVal(c,it[0])):""}</td>`).join("")}</tr>`).join("")}</tbody><tbody class="gap"><tr><td colspan="7"></td></tr></tbody>`).join("")}</table>`]});}
  // 3. 逐月保費一覽表
  const gs=[];members.forEach(c=>policyGroups(c.policies||[]).forEach(g=>{if(g.items.some(active))gs.push({c,g})}));
  const tw={list:0,ann:0,m:Array(12).fill(0)},us={list:0,ann:0,m:Array(12).fill(0)};
  const colHtml=gs.map(({c,g})=>{const main=g.items.find(x=>!x.rider)||g.items[0];const usd=isUSD(main);const m=monthPlan(g.items);
    const ann=g.items.filter(active).reduce((a,p)=>a+annualRaw(p),0);const lst=g.items.filter(active).reduce((a,p)=>a+(num(p.listPremium)?num(p.listPremium)*(fq(p)?12/fq(p):1):0),0);
    const T=usd?us:tw;T.ann+=ann;T.list+=lst;m.forEach((v,i)=>T.m[i]+=v);
    return {name:c.name,co:main.company||"",no:g.no,prod:stripCode(main.product),py:num(main.payYears)?String(num(main.payYears)).padStart(2,"0")+"年":(fq(main)===0?"--":""),sum:sumLabel(main),start:rocDate(main.start),fr:"主約："+(FREQ[fq(main)]||""),holder:main.holder||c.name,list:lst?moneyCur(lst,usd):"",ann:ann?moneyCur(ann,usd):"",pay:main.payMethod||"",m:m.map(v=>v?moneyCur(v,usd):""),usd}});
  const ROWS=[["保險公司","co"],["保單號碼","no"],["主約險種","prod"],["繳費年期","py"],["保額","sum"],["投保日期","start"],["繳別","fr"],["要保人","holder"],["表定保費","list"],["年繳保費","ann"],["繳費資訊","pay"]];
  const mtbl=(cs,totals)=>`<table class="rmon"><colgroup><col style="width:70px"><col span="6"></colgroup><thead><tr><th></th>${cs.map(x=>`<th class="rname">${x?esc(x.name):""}</th>`).join("")}</tr></thead><tbody>
    ${ROWS.map(r=>`<tr class="${r[1]==="prod"?"rprod":""}"><th>${r[0]}</th>${cs.map(x=>`<td>${x?esc(x[r[1]]):""}</td>`).join("")}</tr>`).join("")}
    <tr class="rmh"><td colspan="7">🪙 逐月保費</td></tr>
    ${Array.from({length:12},(_,i)=>`<tr class="rmr"><th><span class="cal">${i+1} 月</span></th>${cs.map(x=>`<td>${x?esc(x.m[i]):""}</td>`).join("")}</tr>`).join("")}</tbody></table>`;

const SCAN_PROMPT=`你是台灣保險業務助理。圖片是客戶的保單整理表、保單首頁或保單明細（可能多張）。請擷取所有保單，只回傳一個 JSON 物件，不要其他文字。格式：
{"insured":"被保險人姓名","insuredBirth":"生日原文","company":"保險公司（可判斷才填）","policies":[{"policyNo":"保單號碼","holder":"要保人","payMethod":"繳費方式","items":[{"product":"商品名稱（含括號代碼）","rider":false,"payYears":20,"target":"本人","start":"1987-01-26","sumText":"95萬","premium":0,"listPremium":"","currency":"TWD","freq":"半年","beneficiary":"滿期:王小明\\n身故:王大明50%","type":"壽險","cov":{"life":95}}]}],"coverage":{}}
規則：
1. 同一個保單號碼底下：主約 rider=false（通常第一列或標示●），附約 rider=true（標示○、名稱含「附約」）。
2. start：民國年加 1911 轉成西元 YYYY-MM-DD（例 76/01/26 → 1987-01-26；112/07/11 → 2023-07-11）。
3. premium：「下期保費」的數字（元，去掉逗號），沒有就填 0。payYears：繳費年期數字（01年 → 1）。freq 只能是 年、半年、季、月 其中之一。
4. type 從這些選一個：壽險、醫療、重疾/重大傷病、癌症、意外、失能、長照、儲蓄/年金、投資型、產險、其他。
5. cov 把保額換算到對應保障：life 壽險身故(萬)、acc 意外身故失能(萬)、med 實支實付(萬/次)、hosp 住院日額(元/日)、ci 重大傷病/重疾(萬)、cancer 癌症一次金(萬)、dis 失能扶助(萬/月)、ltc 長照(萬/月)。對應不到（手術、儲蓄、豁免等）就給 {}。例：終身壽險 95萬 → {"life":95}；住院日額附約 600元 → {"hosp":600}；日額型住院醫療 1000元 → {"hosp":1000}；手術醫療 1000元 → {}。
6. beneficiary 保留原文，多位受益人用 \\n 分行。payMethod 只保留方式與銀行名稱，例如「自繳件」「國泰世華（卡扣件）」「玉山銀行（轉帳件）」，不要輸出卡號、帳號或末四碼。
7. currency：金額或保額有「美元/USD」填 "USD"，否則 "TWD"。freq 若為躉繳填 "躉繳"。listPremium：若圖片有「表定保費」就填數字，否則空字串。
8. 若圖片包含「保障總覽」表格，把被保險人 insured 那一欄的數值原文（例如 "1,428.59萬"、"1,200元~1,800元"）填進 coverage，key 對照：${COVD.map(g=>g[1].map(i=>i[0]+"="+g[0]+"/"+i[1]).join("、")).join("、")}。沒有保障總覽就給 {}。
9. 看不清楚的欄位填空字串，不要猜。`;
async function shrink(file){
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,2000/Math.max(bmp.width,bmp.height));const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*k);cv.height=Math.round(bmp.height*k);cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(b=>r(b||file),"image/jpeg",0.88))}catch(e){return file}
}
async function aiExtract(blobs){
  if(window.StarkAI&&typeof getCfg==="function"&&getCfg()){
    let models=["gemini-flash-latest","gemini-3.6-flash","gemini-3.5-flash","gemini-2.5-flash"];
    const custom=(typeof lsGet==="function"&&lsGet("stark-ai-model"))||"";if(custom)models=[custom].concat(models);
    const r=await window.StarkAI.extract(getCfg(),models,SCAN_PROMPT,blobs);
    const t=r.text.trim().replace(/^```(json)?/,"").replace(/```$/,"");return JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));
  }
  const sample=window.claude&&window.claude.use?await window.claude.use("sample"):null;
  if(sample)return await sample.json(SCAN_PROMPT,{images:blobs,modelTier:"default"});
  throw new Error("這個版本無法使用拍照辨識");
}
function scanErr(e){const m=String((e&&(e.code||e.message))||e);
  if(/not_granted/.test(m))return "你沒有允許使用 Claude 辨識";
  if(/rate_limited|429|quota|RESOURCE_EXHAUSTED/i.test(m))return "辨識次數暫時用完了，請稍後再試";
  if(/API has not been used|disabled|PERMISSION_DENIED|403|firebasevertexai|AI Logic/i.test(m))return "Firebase 尚未開啟 AI Logic（Gemini Developer API），請照說明開啟後再試";
  if(/JSON|Unexpected token|invalid_json/i.test(m))return "照片內容沒辦法整理成保單，請拍清楚一點或換一張";
  if(/network|Failed to fetch/i.test(m))return "網路連線失敗";
  return "辨識失敗："+m.slice(0,160)}

    case "filter":S.filter=el.dataset.f;render();break;
    case "tagf":S.tag=S.tag===el.dataset.t?"":el.dataset.t;render();break;
    case "gapgo":S.filter={ci:"noci",med:"nomed",acc:"noacc",ltc:"noltc",life:"all"}[el.dataset.k];if(el.dataset.k==="life")S.q="";location.hash="clients";render();break;
    case "remDays":S.remDays=+el.dataset.d;render();break;
    case "copyMsg":copy(el.dataset.msg);break;
    case "bulkKind":{const rs=reminders(S.remDays).filter(r=>r.kind===el.dataset.k);openText(KIND[el.dataset.k].n+"訊息（"+rs.length+" 則）",rs.map(r=>"【"+r.c.name+(r.c.phone?" "+r.c.phone:"")+"】\n"+r.msg).join("\n\n"));break}
    case "bulkMsg":{const l=filtered();openText("群發關懷訊息（"+l.length+" 位，可先修改再複製）",l.map(c=>"【"+c.name+(c.phone?" "+c.phone:"")+"】\n"+fill(tpl("care"),{name:c.name,agent:agentName()})).join("\n\n"));break}
    case "claimSc":S.claimSc=el.dataset.k;render();break;
    case "copyClaim":copy(claimText());break;
    case "copyCard":copy(cardText());break;
    case "copyCov":copy(covSummary(M.c));break;
    case "gotoClaim":S.claimCid=M.c.id;closeModal();location.hash="claims";break;
    case "scanPol":openScan();break;
    case "report":{const c=M.c;const fam=c.family?S.clients.filter(x=>x.family===c.family):[];
      if(fam.length>1){const box=document.createElement("div");box.innerHTML=`<div class="mask"><div class="modal sm"><div class="mh"><b>產生保單健檢報表</b></div><div class="mb">要只做 ${esc(c.name)} 本人，還是 ${esc(c.family)} 全家（${fam.length} 人）？</div><div class="mf"><button class="btn" data-one>只有本人</button><button class="btn p" data-all>全家</button></div></div></div>`;document.getElementById("modalRoot").appendChild(box);
        box.querySelector("[data-one]").onclick=()=>{box.remove();openReport([c])};box.querySelector("[data-all]").onclick=()=>{box.remove();openReport([c].concat(fam.filter(x=>x.id!==c.id)))}}
      else openReport([c]);break}
    case "newPol":M.editPol={id:"p"+uid(),_new:true,status:"有效",freq:12,cov:{},rider:"0",target:"本人"};drawModal();break;
    case "editPol":M.editPol=clone(M.c.policies.find(p=>p.id===el.dataset.pid));M.editPol.rider=M.editPol.rider?"1":"0";drawModal();break;
    case "cancelPol":M.editPol=null;drawModal();break;
    case "delPol":confirmBox("確定刪除這張保單？",async()=>{M.c.policies=M.c.policies.filter(p=>p.id!==el.dataset.pid);M.editPol=null;await commitM();drawModal();toast("已刪除保單")});break;
    case "delClient":confirmBox("確定刪除客戶「"+M.c.name+"」及其所有保單與紀錄？此動作無法復原。",async()=>{const id=M.c.id;closeModal();await delClient(id);toast("已刪除")});break;
    case "delLog":M.c.logs=M.c.logs.filter(l=>l.id!==el.dataset.lid);await commitM();drawModal();break;
    case "delSvc":M.c.services=M.c.services.filter(s=>s.id!==el.dataset.sid);await commitM();drawModal();break;
    case "exportCsv":exportCsv();break;
    case "exportPol":exportPol();break;
    case "exportJson":exportJson();break;
    case "importJson":importJson();break;
    case "demo":demo();break;
    case "useLocal":lsSet(MODE_KEY,"local");initStore();break;
    case "toCloud":lsSet(MODE_KEY,null);location.reload();break;
    case "authToggle":S.authMode=S.authMode==="reg"?"":"reg";S.authErr="";render();break;
    case "resetPw":{const em=(document.querySelector("#loginForm [name=email]")||{}).value;if(!em){S.authErr="請先輸入 Email，再按忘記密碼";render();break}
      try{await FB.auth.sendPasswordResetEmail(em);toast("已寄出重設密碼信")}catch(err){S.authErr=AUTH_ERR[err.code]||err.message;render()}break}
    case "logout":await FB.auth.signOut();location.hash="dashboard";break;
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="claimCid"){S.claimCid=t.value;render()}
  if(t.dataset.act==="svcStatus"){const s=M.c.services.find(x=>x.id===t.dataset.sid);s.status=t.value;await commitM();toast("狀態已更新")}
  if(["cDays","cCost","cMonths"].includes(t.id)){S[t.id]=num(t.value);render()}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById("q");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;const fd=Object.fromEntries(new FormData(f).entries());
  if(f.id==="cfgForm"){const c=parseCfg(fd.cfg);if(!c){S.cfgErr="看不懂這段設定，請確認有 apiKey 和 projectId";render();return}lsSet(CFG_KEY,JSON.stringify(c));lsSet(MODE_KEY,null);location.reload();return}
  if(f.id==="loginForm"){S.authErr="";const btn=f.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="處理中…";
    try{if(S.authMode==="reg")await FB.auth.createUserWithEmailAndPassword(fd.email.trim(),fd.pw);else await FB.auth.signInWithEmailAndPassword(fd.email.trim(),fd.pw)}
    catch(err){S.authErr=AUTH_ERR[err.code]||err.message;render()}return}
  if(f.id==="infoForm"){
    if(!fd.name.trim()){toast("請填寫姓名");return}
    fd.idNo=(fd.idNo||"").toUpperCase().replace(/\s/g,"");
    if(fd.idNo&&idCheck(fd.idNo)===false){toast("身分證字號格式或檢查碼不正確，請再確認");return}
    if(fd.idNo&&!fd.gender&&/^[A-Z][12]/.test(fd.idNo))fd.gender=fd.idNo[1]==="1"?"男":"女";
    if(fd.idNo&&S.clients.some(x=>x.id!==M.c.id&&x.idNo===fd.idNo)){toast("這個身分證字號已經有客戶使用，請確認是否重複建檔");return}
    Object.assign(M.c,fd,{name:fd.name.trim(),tags:fd.tags.split(/[,，、]/).map(s=>s.trim()).filter(Boolean)});
    const wasNew=M.c.isNew;await commitM();toast(wasNew?"已建立客戶":"已儲存");if(wasNew){M.tab="pol"}drawModal();
  }
  if(f.id==="polForm"){
    const p=M.editPol;const c={};COV.forEach(x=>{const v=fd["cov_"+x.k];if(v!==""&&v!=null)c[x.k]=num(v)});
    const np={id:p.id,company:fd.company,product:fd.product,type:fd.type,policyNo:fd.policyNo,holder:fd.holder,status:fd.status,start:fd.start,payYears:fd.payYears,freq:+fd.freq,premium:fd.premium,payMethod:fd.payMethod,note:fd.note,cov:c,rider:fd.rider==="1",target:fd.target,sumText:fd.sumText,beneficiary:fd.beneficiary,currency:fd.currency,listPremium:fd.listPremium};
    M.c.policies=M.c.policies||[];const i=M.c.policies.findIndex(x=>x.id===p.id);if(i>=0)M.c.policies[i]=np;else M.c.policies.push(np);
    M.editPol=null;await commitM();toast("保單已儲存");drawModal();
  }
  if(f.id==="covdForm"){M.c.covDetail={};COVD_KEYS.forEach(k=>{const v=(fd[k]||"").trim();if(v)M.c.covDetail[k]=v});await commitM();toast("詳細保障已儲存");drawModal();return}
  if(f.id==="logForm"){
    M.c.logs=M.c.logs||[];M.c.logs.push({id:"l"+uid(),date:fd.date,type:fd.type,content:fd.content});
    if(!M.c.lastContact||fd.date>M.c.lastContact)M.c.lastContact=fd.date;await commitM();drawModal();
  }
  if(f.id==="svcForm"){M.c.services=M.c.services||[];M.c.services.push({id:"s"+uid(),date:fd.date,type:fd.type,status:fd.status,note:fd.note});await commitM();drawModal();toast("已新增服務件")}
  if(f.id==="profForm"){
    const p=S.profile;["agent","title","company","phone","line","email","slogan","area","usdRate"].forEach(k=>p[k]=fd[k]||"");
    p.targets={};COV.forEach(x=>{const v=fd["t_"+x.k];if(v!=="")p.targets[x.k]=num(v)});
    p.tpl={};Object.keys(DEF_TPL).forEach(k=>{const v=(fd["tpl_"+k]||"").trim();if(v&&v!==DEF_TPL[k])p.tpl[k]=v});
    p.type="profile";await saveProfile();toast("設定已儲存");
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&M)closeModal()});

route();initStore();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!window.Capacitor){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
</body>
</html>
