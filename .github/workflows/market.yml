name: 每日市場資訊

on:
  schedule:
    - cron: "10 22 * * 0-4"   # 台灣 06:10（美股收盤後）
    - cron: "40 5 * * 1-5"    # 台灣 13:40（台股收盤後）
    - cron: "20 1 * * 1-5"    # 台灣 09:20（台銀匯率更新）
    - cron: "0 0 * * *"       # 台灣 08:00 更新今日重點影音
  workflow_dispatch:

permissions:
  contents: write

jobs:
  market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓取行情
        run: node .github/scripts/market.mjs
        env:
          VIDEOS: ${{ (github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
      - name: 發布到 data 分支
        run: |
          cd out
          git init -q
          git checkout -q -b data
          git config user.name "Stark CRM"
          git config user.email "stark-crm@users.noreply.github.com"
          git add market.json
          git commit -qm "market $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
