name: 編譯 Android App 與部署網頁版

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  changes:
    name: 判斷是否需要重編 APK
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.f.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        name: 只有程式／介面有改才編 APK（每日正能量、行銷資料、建議書檔案等不編）
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "app=true" >> $GITHUB_OUTPUT; exit 0; fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE="HEAD~1"; fi
          FILES=$(git diff --name-only "$BEFORE" HEAD || true)
          echo "$FILES"
          if echo "$FILES" | grep -Eq '^(www/index\.html|www/sw\.js|www/app-update\.js|www/firebase-config\.js|www/manifest\.webmanifest|www/bridge\.html|www/vendor/|www/calc/|www/icons/|www/media/|assets/|capacitor\.config\.json|package\.json|keystore/|\.github/workflows/build\.yml)'; then echo "app=true" >> $GITHUB_OUTPUT; else echo "app=false" >> $GITHUB_OUTPUT; fi

  android:
    name: 編譯 APK
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 安裝套件
        run: npm install
      - name: 建立 Android 專案
        run: npx cap add android
      - name: 產生 App 圖示
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#14365c" --iconBackgroundColorDark "#14365c" --splashBackgroundColor "#14365c" --splashBackgroundColorDark "#14365c"
      - name: 設定版本號
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: 寫入 App 版號（供 App 內檢查新版本）
        run: echo "window.STARK_BUILD=${{ github.run_number }};" > www/app-version.js
      - name: 使用固定簽章（之後更新可直接覆蓋安裝）
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
      - name: 同步網頁檔並編譯
        run: |
          rm -rf www/proposals/files www/proposals/models
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: 整理 APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StarkCRM.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StarkCRM-apk
          path: StarkCRM.apk
      - name: 發佈到 Releases（固定下載連結）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 史塔克CRM v1.0.${{ github.run_number }}
          body: 下載 StarkCRM.apk 到 Android 手機安裝即可。更新版本直接覆蓋安裝，資料在雲端不會不見。
          files: StarkCRM.apk
          make_latest: true

  web:
    name: 部署網頁版
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
