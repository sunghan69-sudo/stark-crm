name: 更新程式關係圖（graphify）

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - '.github/scripts/**'
      - '.graphifyignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graphify
  cancel-in-progress: true

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝 graphify
        run: pip install graphifyy
      - name: 抽出 index.html 內的主程式
        run: python .github/scripts/graph-extract.py
      - name: 重建關係圖（不用 AI、不花錢）
        run: graphify update . --force
      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add graphify-out/graph.json graphify-out/graph.html graphify-out/GRAPH_REPORT.md
          if git diff --cached --quiet; then echo "關係圖沒有變動"; exit 0; fi
          git commit -m "更新程式關係圖 [skip ci]"
          git pull --rebase origin main
          git push
